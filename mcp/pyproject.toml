[project]
name = "mdopendata-mcp"
version = "0.1.0"
description = "mdopendata project MCP server for schema introspection, read-only SQL, diagrams, and release help exports."
requires-python = ">=3.11"
dependencies = [
  "graphviz>=0.20",
  "matplotlib>=3.8",
  "mcp>=1.2.0",
  "pandas>=2.0",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "sqlglot>=23.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
mdopendata-mcp = "mdopendata_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdopendata_mcp"]

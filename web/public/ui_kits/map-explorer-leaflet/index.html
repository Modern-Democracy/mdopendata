<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City View Map - Modern Democracy</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../leaflet-theme.css">
<link rel="stylesheet" href="../parcel-lookup/styles.css">
<style>
  html, body { height: 100%; margin: 0; }
  .map-app { display: grid; grid-template-rows: auto 1fr; height: 100vh; background: var(--paper); }
  .map-body { display: grid; grid-template-columns: 290px minmax(0, 1fr) 330px; min-height: 0; overflow: hidden; }
  .map-panel { background: var(--paper-2); border-right: 1px solid var(--border-hair); overflow-y: auto; padding: 18px 18px 40px; }
  .map-panel.right { border-right: 0; border-left: 1px solid var(--border-hair); }
  .panel-title { font-family: var(--font-ui); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 10px; }
  .panel-title:not(:first-child) { margin-top: 22px; }
  .layer { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; cursor: pointer; }
  .layer:hover { background: var(--paper-3); }
  .layer input { accent-color: var(--forest); }
  .layer .sw { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(26,22,18,0.15); flex-shrink: 0; }
  .layer .name { font-family: var(--font-ui); font-size: 13px; color: var(--ink); }
  .layer .count { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); }
  .map-canvas { position: relative; min-width: 0; min-height: 0; background: var(--paper-3); }
  #map { position: absolute; inset: 0; }
  .map-status { position: absolute; top: 16px; left: 16px; z-index: 500; max-width: min(380px, calc(100% - 32px)); background: rgba(245,239,225,0.96); border: 1px solid var(--border-hair); border-radius: 4px; padding: 8px 10px; font-family: var(--font-ui); font-size: 12.5px; color: var(--fg-3); box-shadow: var(--shadow-sm); }
  .legend-inline { background: rgba(245,239,225,0.96); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; font-family: var(--font-ui); }
  .legend-inline .row { display:flex; align-items:center; gap:8px; font-size: 12px; color: var(--ink); padding: 2px 0; }
  .legend-inline .sw { width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(26,22,18,0.15); }
  .legend-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
  .legend-toggle button { border: 1px solid var(--border); background: var(--paper); color: var(--fg-2); border-radius: 4px; padding: 6px 8px; font-family: var(--font-ui); font-size: 12px; cursor: pointer; }
  .legend-toggle button.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .selected-card, .status-card { background: var(--paper); border: 1px solid var(--border); border-radius: 4px; padding: 14px; margin-bottom: 14px; }
  .selected-card .addr { font-family: var(--font-display); font-variation-settings: "opsz" 48; font-weight: 500; font-size: 20px; line-height: 1.1; color: var(--ink); margin: 0 0 4px; }
  .selected-card .pid, .status-card { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-3); }
  .selected-card .zchip { font-family: var(--font-mono); font-weight: 600; font-size: 14px; padding: 4px 10px; border-radius: 3px; border: 1px solid rgba(26,22,18,0.12); display:inline-block; margin: 12px 8px 8px 0; }
  .zone-line { font-family: var(--font-ui); font-size: 12.5px; color: var(--fg-3); margin-bottom: 8px; }
  .mini-rules { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; font-family: var(--font-ui); font-size: 12px; margin-top: 12px; }
  .mini-rules .k { color: var(--fg-3); }
  .mini-rules .v { font-family: var(--font-mono); color: var(--ink); text-align: right; }
  .route-actions { display: grid; gap: 8px; }
  .route-actions a[aria-disabled="true"] { pointer-events: none; opacity: 0.55; }
  .source-list { display: grid; gap: 8px; font-family: var(--font-ui); font-size: 12.5px; color: var(--fg-2); line-height: 1.35; }
  .source-list .item { padding-bottom: 8px; border-bottom: 1px solid var(--border-hair); }
  .source-list .item:last-child { border-bottom: 0; }
  .source-list .label { color: var(--ink); font-weight: 500; }
  .filter-list { display: grid; gap: 10px; margin-bottom: 4px; }
  .filter-list label { display: grid; gap: 5px; font-family: var(--font-ui); font-size: 12px; color: var(--fg-3); }
  .filter-list select { width: 100%; border: 1px solid var(--border); border-radius: 4px; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 13px; padding: 8px 9px; }
  .leaflet-pane.leaflet-buildings-pane { z-index: 395; }
  .leaflet-pane.leaflet-zones-pane { z-index: 410; }
  @media (max-width: 980px) {
    .map-app { height: auto; min-height: 100vh; }
    .map-body { grid-template-columns: 1fr; grid-template-rows: auto 540px auto; overflow: visible; }
    .map-panel, .map-panel.right { border: 0; border-bottom: 1px solid var(--border-hair); }
  }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
<div class="map-app">
  <header class="app-header">
    <img src="../../assets/logo-island-needle.svg" alt="Modern Democracy" class="wm">
    <nav>
      <a href="/parcel-lookup">Parcel lookup</a>
      <a href="/zoning-comparison">Compare bylaws</a>
      <a href="/restriction-stack">View Spatial Restrictions</a>
      <a href="/provisions-comparison">Compare provisions</a>
      <a class="active" href="/city-view">Map</a>
      <a href="/parcel-3d">3D view</a>
    </nav>
  </header>
  <div class="map-body">
    <aside class="map-panel">
      <h3 class="panel-title">Layers</h3>
      <label class="layer"><input type="checkbox" checked id="l-current"><span class="sw" style="background: var(--brick)"></span><span class="name">Current zoning</span><span class="count" id="c-current">0</span></label>
      <label class="layer"><input type="checkbox" checked id="l-draft"><span class="sw" style="background: var(--ochre)"></span><span class="name">Draft zoning</span><span class="count" id="c-draft">0</span></label>
      <label class="layer"><input type="checkbox" checked id="l-buildings"><span class="sw" style="background: #d8c3a2"></span><span class="name">Buildings</span><span class="count" id="c-buildings">0</span></label>
      <label class="layer"><input type="checkbox" checked id="l-parcels"><span class="sw" style="background: var(--paper-2); border-color: var(--ink-3)"></span><span class="name">Parcel outlines</span><span class="count" id="c-parcels">0</span></label>

      <h3 class="panel-title">Zone filters</h3>
      <div class="filter-list">
        <label>Current zone
          <select id="f-current"><option value="">All current zones</option></select>
        </label>
        <label>Draft zone
          <select id="f-draft"><option value="">All draft zones</option></select>
        </label>
      </div>

      <h3 class="panel-title">Legend</h3>
      <div class="legend-inline">
        <div class="legend-toggle" role="group" aria-label="Zone legend layer">
          <button type="button" class="active" id="legend-current">Current</button>
          <button type="button" id="legend-draft">Draft</button>
        </div>
        <div id="zone-legend"></div>
      </div>
    </aside>
    <main class="map-canvas">
      <div id="map" aria-label="Charlottetown city map"></div>
      <div class="map-status" id="status">Loading visible map layers.</div>
    </main>
    <aside class="map-panel right">
      <h3 class="panel-title">Selected parcel</h3>
      <div id="selected" class="status-card">Click a parcel outline to resolve an address PID.</div>
      <div class="route-actions">
        <a class="btn btn-secondary" href="/parcel-lookup" style="justify-content: center">Search by address</a>
        <a class="btn btn-primary" id="open-parcel" aria-disabled="true" style="justify-content: center">Open full parcel</a>
        <a class="btn btn-secondary" id="compare-parcel" aria-disabled="true" style="justify-content: center"><i data-lucide="git-compare" style="width:14px;height:14px"></i> Compare to draft</a>
        <a class="btn btn-secondary" id="view-3d" aria-disabled="true" style="justify-content: center"><i data-lucide="box" style="width:14px;height:14px"></i> 3D view</a>
      </div>
    </aside>
  </div>
</div>

<script>
const CENTER = [46.2382, -63.1311];
const ZONE_COLORS = {
  RN: 'var(--zone-rn)',
  RM: 'var(--zone-rm)',
  RH: 'var(--zone-rh)',
  DC: 'var(--zone-dc)',
  DMS: 'var(--zone-dms)',
  DMU: 'var(--zone-dmu)',
  DN: 'var(--zone-dn)',
  DW: 'var(--zone-dw)',
  BP: 'var(--zone-bp)',
  AP: 'var(--zone-ap)',
  HI: 'var(--zone-hi)',
  P: 'var(--zone-port)',
  GC: 'var(--zone-gc)',
  GN: 'var(--zone-gn)',
  I: 'var(--zone-i)',
  PPS: 'var(--zone-pps)',
  POS: 'var(--zone-pos)',
  C: 'var(--zone-c)',
  EG: 'var(--zone-eg)',
  UE: 'var(--zone-ue)',
};
const LEGACY_ZONE_COLORS = {
  R: 'var(--zone-residential)',
  D: 'var(--zone-mixed)',
  M: 'var(--zone-mixed)',
  O: 'var(--zone-openspace)',
  W: 'var(--zone-waterfront)',
  H: 'var(--zone-heritage)',
};

const CURRENT_ZONE_COLORS = {
  A: 'var(--zone-ap)',
  'C-1': 'var(--zone-dms)',
  'C-2': 'var(--zone-gc)',
  'C-3': 'var(--zone-gn)',
  CDA: 'var(--zone-ue)',
  DC: 'var(--zone-dc)',
  DMS: 'var(--zone-dms)',
  DMU: 'var(--zone-dmu)',
  DMUN: 'var(--zone-dn)',
  DN: 'var(--zone-dw)',
  'ER-MUVC': 'var(--zone-gc)',
  FD: 'var(--zone-ue)',
  I: 'var(--zone-i)',
  'M-1': 'var(--zone-bp)',
  'M-2': 'var(--zone-hi)',
  'M-3': 'var(--zone-ap)',
  MH: 'var(--zone-rm)',
  MHR: 'var(--zone-rm)',
  MUC: 'var(--zone-gc)',
  MUR: 'var(--zone-rh)',
  NA: 'var(--zone-eg)',
  OS: 'var(--zone-pps)',
  P: 'var(--zone-port)',
  PC: 'var(--zone-pos)',
  PZ: 'var(--zone-port)',
  'R-1L': 'var(--zone-rn)',
  'R-1N': 'var(--zone-rn)',
  'R-1S': 'var(--zone-rn)',
  'R-2': 'var(--zone-rm)',
  'R-2S': 'var(--zone-rm)',
  'R-3': 'var(--zone-rh)',
  'R-3T': 'var(--zone-rh)',
  'R-4': 'var(--zone-dn)',
  'R-4A': 'var(--zone-dn)',
  'R-4B': 'var(--zone-dn)',
  WF: 'var(--zone-dw)',
  WLC: 'var(--zone-dw)',
  'WL-OS': 'var(--zone-pps)',
  U: 'var(--zone-ue)',
};

const CURRENT_ZONE_LEGEND = [
  ['R-1L', 'Single detached residential'],
  ['R-1N', 'Narrow single detached residential'],
  ['R-1S', 'Single detached residential'],
  ['R-2', 'Low density residential'],
  ['R-2S', 'Low density residential single'],
  ['R-3', 'Medium density residential'],
  ['R-3T', 'Medium density residential townhouse'],
  ['R-4', 'Apartment residential'],
  ['R-4A', 'Apartment residential'],
  ['R-4B', 'Apartment residential'],
  ['MH', 'Manufactured housing'],
  ['MHR', 'Manufactured housing residential'],
  ['C-1', 'Business office commercial'],
  ['C-2', 'Highway commercial'],
  ['C-3', 'Shopping centre commercial'],
  ['MUC', 'Mixed-use corridor'],
  ['MUR', 'Medium density mixed-use residential'],
  ['ER-MUVC', 'East Royalty mixed-use village centre'],
  ['DC', 'Downtown core'],
  ['DMS', 'Downtown main street'],
  ['DMU', 'Downtown mixed-use'],
  ['DMUN', 'Downtown mixed-use neighbourhood'],
  ['DN', 'Downtown narrow'],
  ['M-1', 'Light industrial'],
  ['M-2', 'Heavy industrial'],
  ['M-3', 'Business park industrial'],
  ['I', 'Institutional'],
  ['OS', 'Open space'],
  ['PC', 'Park / cultural'],
  ['A', 'Airport'],
  ['P', 'Parking'],
  ['PZ', 'Port'],
  ['WF', 'Waterfront'],
  ['WLC', 'Water lot commercial'],
  ['WL-OS', 'Water lot open space'],
  ['CDA', 'Comprehensive development area'],
  ['FD', 'Future development'],
  ['NA', 'Zoning not assigned'],
  ['U', 'Infill area'],
];

const DRAFT_ZONE_LEGEND = [
  ['RN', 'Neighbourhood'],
  ['RM', 'Medium Density Residential'],
  ['RH', 'High Order Residential'],
  ['DC', 'Downtown Core'],
  ['DMS', 'Downtown Main Street'],
  ['DMU', 'Downtown Mixed Use'],
  ['DN', 'Downtown Neighbourhood'],
  ['DW', 'Downtown Waterfront'],
  ['BP', 'Business Park'],
  ['AP', 'Airport Periphery'],
  ['HI', 'Heavy Industrial'],
  ['P', 'Port'],
  ['GC', 'Growth Corridor'],
  ['GN', 'Growth Node'],
  ['I', 'Institutional'],
  ['PPS', 'Parks and Public Spaces'],
  ['POS', 'Privately-owned Open Spaces'],
  ['C', 'Conservation'],
  ['EG', 'Eastern Gateway'],
  ['UE', 'Urban Expansion'],
];

const state = {
  layers: { current: true, draft: true, buildings: true, parcels: true },
  filters: { currentZone: '', draftZone: '' },
  currentLayer: null,
  draftLayer: null,
  buildingsLayer: null,
  parcelLayer: null,
  selectedLayer: null,
  selectedPid: null,
  timer: null,
  requestId: 0,
};
const DETAIL_ZOOM = 15;

const map = L.map('map', { zoomControl: true }).setView(CENTER, 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20,
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);
L.control.scale({ metric: true, imperial: false }).addTo(map);
map.createPane('buildingsPane');
map.createPane('zonesPane');

function zoneColor(code) {
  const key = String(code || '').trim().toUpperCase();
  return ZONE_COLORS[key] || CURRENT_ZONE_COLORS[key] || LEGACY_ZONE_COLORS[key.charAt(0)] || 'var(--paper-3)';
}

function renderZoneLegend(mode) {
  const activeMode = mode === 'draft' ? 'draft' : 'current';
  const legend = activeMode === 'draft' ? DRAFT_ZONE_LEGEND : CURRENT_ZONE_LEGEND;
  document.getElementById('legend-current').classList.toggle('active', activeMode === 'current');
  document.getElementById('legend-draft').classList.toggle('active', activeMode === 'draft');
  document.getElementById('zone-legend').innerHTML = legend.map(([code, label]) => `
    <div class="row"><span class="sw" style="background: ${zoneColor(code)}"></span>${label} (${code})</div>
  `).join('');
}

function bboxString() {
  const bounds = map.getBounds();
  return [
    bounds.getWest(),
    bounds.getSouth(),
    bounds.getEast(),
    bounds.getNorth(),
  ].map((value) => value.toFixed(6)).join(',');
}

function layerMode() {
  return map.getZoom() >= DETAIL_ZOOM ? 'detail' : 'overview';
}

function layerLimit(key) {
  if (layerMode() === 'detail') {
    return { buildings: 2500, current: 1000, draft: 1000, parcels: 1500 }[key];
  }
  return { buildings: 50000, current: 50000, draft: 50000, parcels: 50000 }[key];
}

function filterParams() {
  const params = new URLSearchParams();
  if (state.filters.currentZone) params.set('currentZone', state.filters.currentZone);
  if (state.filters.draftZone) params.set('draftZone', state.filters.draftZone);
  return params;
}

function zoneFilterParam(zone) {
  return zone ? `&zone=${encodeURIComponent(zone)}` : '';
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function setCount(key, count) {
  document.getElementById(`c-${key}`).textContent = String(count);
}

function formatArea(areaM2) {
  if (!Number.isFinite(Number(areaM2))) return 'pending';
  const hectares = Number(areaM2) / 10000;
  return hectares >= 1 ? `${hectares.toFixed(2)} ha` : `${Number(areaM2).toFixed(0)} m2`;
}

function polygonStyle(color, weight, opacity) {
  return { color, weight, opacity: 0.95, fillColor: color, fillOpacity: opacity };
}

function draftPolygonStyle(color) {
  return { color: 'rgba(26,22,18,0)', weight: 0, opacity: 0, fillColor: color, fillOpacity: 0.75 };
}

function currentPolygonStyle(color) {
  return { color, weight: 5.0, opacity: 1, fillColor: color, fillOpacity: 0.1 };
}

function buildingStyle() {
  return { color: 'rgba(54,102,76,0.58)', weight: 0.6, opacity: 0.85, fillColor: '#d8c3a2', fillOpacity: 0.2 };
}

function clearLayer(key) {
  if (state[key]) {
    state[key].remove();
    state[key] = null;
  }
}

function replaceSelectedGeometry(geometry) {
  clearLayer('selectedLayer');
  if (!geometry) return;
  state.selectedLayer = L.geoJSON(geometry, {
    style: { color: '#8f3d2f', weight: 3, fillColor: '#8f3d2f', fillOpacity: 0.12 },
    interactive: false,
  }).addTo(map);
  state.selectedLayer.bringToFront();
}

async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}.`);
  return response.json();
}

function updateActions(pid) {
  const open = document.getElementById('open-parcel');
  const compare = document.getElementById('compare-parcel');
  const view3d = document.getElementById('view-3d');
  if (!pid) {
    open.removeAttribute('href');
    compare.removeAttribute('href');
    view3d.removeAttribute('href');
    open.setAttribute('aria-disabled', 'true');
    compare.setAttribute('aria-disabled', 'true');
    view3d.setAttribute('aria-disabled', 'true');
    return;
  }
  open.href = `/map-explorer?pid=${encodeURIComponent(pid)}`;
  compare.href = `/zoning-comparison?pid=${encodeURIComponent(pid)}`;
  view3d.href = `/parcel-3d?pid=${encodeURIComponent(pid)}`;
  open.removeAttribute('aria-disabled');
  compare.removeAttribute('aria-disabled');
  view3d.removeAttribute('aria-disabled');
}

function renderSelected(payload) {
  const selected = document.getElementById('selected');
  const pid = payload.address?.pid || null;
  state.selectedPid = pid;
  updateActions(pid);
  if (!pid) {
    selected.className = 'status-card';
    selected.textContent = 'Parcel found, but no civic-address PID was available for routing.';
    return;
  }
  selected.className = '';
  selected.innerHTML = `
    <div class="selected-card">
      <h4 class="addr">${payload.address?.label || 'Selected parcel'}</h4>
      <div class="pid">PID ${pid} / ${formatArea(payload.parcel?.areaM2)}</div>
      <span class="zchip" style="background: var(--paper-3)">Parcel</span>
      <div class="zone-line">Resolution: ${payload.resolution?.status || 'pending'}</div>
      <div class="mini-rules">
        <div class="k">Source</div><div class="v">${payload.resolution?.method || 'pending'}</div>
        <div class="k">Parcel id</div><div class="v">${payload.parcel?.parcelId || 'pending'}</div>
      </div>
    </div>
  `;
}

async function resolveClickedParcel(latlng, layer) {
  setStatus('Resolving clicked parcel.');
  try {
    const payload = await fetchJson(`/api/parcels/point?lon=${latlng.lng.toFixed(7)}&lat=${latlng.lat.toFixed(7)}`);
    replaceSelectedGeometry(payload.parcel?.geometry);
    renderSelected(payload);
    setStatus(payload.address?.pid ? `Selected PID ${payload.address.pid}.` : 'Parcel selected without routable PID.');
  } catch (error) {
    setStatus(error.message || 'Parcel click resolution failed.');
  }
}

function renderZoneOptions(selectId, zones, selectedValue, allLabel) {
  const select = document.getElementById(selectId);
  const selected = selectedValue || '';
  select.innerHTML = `<option value="">${allLabel}</option>${(zones || []).map((zone) => (
    `<option value="${zone}"${zone === selected ? ' selected' : ''}>${zone}</option>`
  )).join('')}`;
  if (selected && !Array.from(select.options).some((option) => option.value === selected)) {
    select.insertAdjacentHTML('beforeend', `<option value="${selected}" selected>${selected}</option>`);
  }
}

async function loadZoneFilters() {
  const params = filterParams();
  const suffix = params.toString() ? `?${params}` : '';
  const payload = await fetchJson(`/api/city-view/zone-filters${suffix}`);
  renderZoneOptions('f-current', payload.options?.current || [], state.filters.currentZone, 'All current zones');
  renderZoneOptions('f-draft', payload.options?.draft || [], state.filters.draftZone, 'All draft zones');
}

async function loadViewport() {
  const requestId = ++state.requestId;
  const bbox = bboxString();
  setStatus('Loading visible map layers.');

  const detail = layerMode();
  const parcelFilters = filterParams();
  const parcelFilterSuffix = parcelFilters.toString() ? `&${parcelFilters}` : '';
  const requests = [];
  if (state.layers.buildings) requests.push(['buildings', fetchJson(`/api/buildings/osm.geojson?bbox=${bbox}&limit=${layerLimit('buildings')}&detail=${detail}`)]);
  if (state.layers.current) requests.push(['current', fetchJson(`/api/zoning/current.geojson?bbox=${bbox}&limit=${layerLimit('current')}&detail=${detail}${zoneFilterParam(state.filters.currentZone)}`)]);
  if (state.layers.draft) requests.push(['draft', fetchJson(`/api/zoning/draft.geojson?bbox=${bbox}&limit=${layerLimit('draft')}&detail=${detail}${zoneFilterParam(state.filters.draftZone)}`)]);
  if (state.layers.parcels) requests.push(['parcels', fetchJson(`/api/parcels.geojson?bbox=${bbox}&limit=${layerLimit('parcels')}&detail=${detail}${parcelFilterSuffix}`)]);

  try {
    const results = await Promise.all(requests.map(async ([key, promise]) => [key, await promise]));
    if (requestId !== state.requestId) return;

    clearLayer('currentLayer');
    clearLayer('draftLayer');
    clearLayer('buildingsLayer');
    clearLayer('parcelLayer');
    setCount('current', 0);
    setCount('draft', 0);
    setCount('buildings', 0);
    setCount('parcels', 0);

    for (const [key, geojson] of results) {
      const count = geojson.features?.length || 0;
      setCount(key, count);
      if (key === 'buildings') {
        state.buildingsLayer = L.geoJSON(geojson, {
          pane: 'buildingsPane',
          style: buildingStyle,
          interactive: false,
        }).addTo(map);
      }
      if (key === 'current') {
        state.currentLayer = L.geoJSON(geojson, {
          pane: 'zonesPane',
          style: (feature) => currentPolygonStyle(zoneColor(feature.properties?.zoneCode)),
          interactive: false,
        }).addTo(map);
      }
      if (key === 'draft') {
        state.draftLayer = L.geoJSON(geojson, {
          pane: 'zonesPane',
          style: (feature) => draftPolygonStyle(zoneColor(feature.properties?.zoneCode)),
          interactive: false,
        }).addTo(map);
      }
      if (key === 'parcels') {
        state.parcelLayer = L.geoJSON(geojson, {
          style: { color: 'rgba(26,22,18,0.35)', weight: 0.6, fillOpacity: 0 },
          interactive: false,
        }).addTo(map);
        state.parcelLayer.bringToFront();
        if (state.selectedLayer) state.selectedLayer.bringToFront();
      }
    }

    const total = results.reduce((sum, [, geojson]) => sum + (geojson.features?.length || 0), 0);
    setStatus(`Loaded ${total} visible features in ${detail} mode.`);
  } catch (error) {
    if (requestId === state.requestId) setStatus(error.message || 'Map layer loading failed.');
  }
}

function scheduleLoad() {
  window.clearTimeout(state.timer);
  state.timer = window.setTimeout(loadViewport, 180);
}

document.getElementById('l-current').addEventListener('change', (event) => {
  state.layers.current = event.target.checked;
  scheduleLoad();
});
document.getElementById('l-draft').addEventListener('change', (event) => {
  state.layers.draft = event.target.checked;
  scheduleLoad();
});
document.getElementById('l-buildings').addEventListener('change', (event) => {
  state.layers.buildings = event.target.checked;
  scheduleLoad();
});
document.getElementById('l-parcels').addEventListener('change', (event) => {
  state.layers.parcels = event.target.checked;
  scheduleLoad();
});
document.getElementById('f-current').addEventListener('change', async (event) => {
  state.filters.currentZone = event.target.value;
  await loadZoneFilters();
  scheduleLoad();
});
document.getElementById('f-draft').addEventListener('change', async (event) => {
  state.filters.draftZone = event.target.value;
  await loadZoneFilters();
  scheduleLoad();
});
document.getElementById('legend-current').addEventListener('click', () => renderZoneLegend('current'));
document.getElementById('legend-draft').addEventListener('click', () => renderZoneLegend('draft'));

map.on('click', (event) => resolveClickedParcel(event.latlng));
map.on('moveend zoomend', scheduleLoad);
renderZoneLegend('current');
loadZoneFilters().catch((error) => setStatus(error.message || 'Zone filter loading failed.'));
scheduleLoad();
lucide.createIcons();
</script>
</body>
</html>

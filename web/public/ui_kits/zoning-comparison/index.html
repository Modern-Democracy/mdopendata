<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoning Comparison - Modern Democracy</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../parcel-lookup/styles.css">
<style>
  .compare-shell { max-width: 1180px; margin: 0 auto; padding: 34px 24px 56px; }
  .page-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-bottom: 24px; }
  .eyebrow { font-family: var(--font-ui); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .page-head h1 { font-family: var(--font-display); font-variation-settings: "opsz" 72; font-weight: 500; font-size: 42px; line-height: 1.02; margin: 0 0 8px; color: var(--ink); }
  .page-head p { font-family: var(--font-ui); font-size: 14px; color: var(--fg-3); line-height: 1.45; margin: 0; max-width: 72ch; }
  .head-actions { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .summary-bar { background: var(--paper-2); border: 1px solid var(--border-hair); border-radius: 6px; padding: 16px 18px; margin-bottom: 20px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .summary-stat .n { font-family: var(--font-display); font-variation-settings: "opsz" 72; font-weight: 500; font-size: 27px; line-height: 1; color: var(--ink); }
  .summary-stat .l { font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); margin-top: 4px; }
  .summary-stat.changed .n { color: var(--ochre-ink); }
  .summary-stat.pending .n { color: var(--brick-ink); }
  .view-toggle { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--border-hair); border-radius: 6px; background: var(--paper); }
  .view-toggle button { border: 0; border-radius: 4px; background: transparent; color: var(--fg-3); cursor: pointer; font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 8px 10px; }
  .view-toggle button.active { background: var(--ink); color: var(--paper); }
  .compare-grid { display: grid; grid-template-columns: 1fr 190px 1fr; border: 1px solid var(--border-hair); border-radius: 6px; overflow: hidden; background: var(--paper); }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--border-hair); background: var(--paper-2); }
  .col-head.current { border-right: 1px solid var(--border-hair); }
  .col-head.label { justify-content: center; background: var(--paper-3); border-right: 1px solid var(--border-hair); }
  .col-head .dot { width: 10px; height: 10px; border-radius: 50%; }
  .col-head .name { font-family: var(--font-ui); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
  .col-head .sub { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-left: auto; }
  .diff-cell { min-height: 48px; min-width: 0; padding: 13px 16px; border-bottom: 1px solid var(--border-hair); font-family: var(--font-ui); font-size: 14px; color: var(--fg-2); display: flex; align-items: center; gap: 8px; }
  .diff-cell.current { justify-content: flex-end; text-align: right; border-right: 1px solid var(--border-hair); }
  .diff-cell.label { justify-content: center; text-align: center; background: var(--paper-3); color: var(--ink); font-weight: 500; font-size: 12.5px; border-right: 1px solid var(--border-hair); }
  .diff-cell.draft { justify-content: flex-start; }
  .diff-cell.empty { color: var(--fg-3); opacity: 0.65; }
  .diff-cell.numeric-changed .value { color: var(--brick-ink); }
  .value { font-family: var(--font-mono); font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
  .value.multi-line { white-space: pre-line; }
  .marker { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 6px; border-radius: 2px; letter-spacing: 0.05em; white-space: nowrap; }
  .marker.changed { background: var(--ochre-wash); color: var(--ochre-ink); }
  .marker.same, .marker.source { background: var(--paper-2); color: var(--fg-3); }
  .marker.pending { background: var(--brick-wash); color: var(--brick-ink); }
  .citation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
  .citation-card { border: 1px solid var(--border-hair); border-radius: 6px; background: var(--paper-2); padding: 16px; }
  .citation-card h2 { font-family: var(--font-ui); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 12px; color: var(--fg-3); }
  .citation-list { display: grid; gap: 10px; }
  .citation-item { padding-bottom: 10px; border-bottom: 1px solid var(--border-hair); font-family: var(--font-ui); font-size: 13px; color: var(--fg-2); line-height: 1.35; }
  .citation-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .citation-item .title { color: var(--ink); font-weight: 500; }
  .citation-item .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 3px; }
  .citation-item .clause { margin-top: 8px; }
  .citation-item .clause-label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-right: 6px; }
  .clause-toggle { background: transparent; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; border-bottom: 1px dotted var(--brick-ink); }
  .clause-toggle:hover { color: var(--brick-ink); }
  .clause-toggle .chev { display: inline-block; font-size: 9px; color: var(--brick-ink); margin-right: 4px; transition: transform 0.15s; }
  .clause-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .resolved { margin: 6px 0 4px; padding: 6px 0 2px 12px; border-left: 2px solid var(--brick-wash); }
  .resolved-section { margin-top: 6px; }
  .resolved-section > .title { color: var(--ink); font-weight: 500; font-size: 12.5px; }
  .provenance { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10.5px; color: var(--brick-ink); background: var(--brick-wash); padding: 1px 6px; border-radius: 2px; margin-left: 6px; letter-spacing: 0.04em; vertical-align: 2px; }
  .resolved-cap { font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); font-style: italic; padding: 4px 0; }
  .citation-item table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  .citation-item th, .citation-item td { border: 1px solid var(--border-hair); padding: 6px; vertical-align: top; }
  .citation-item th { background: var(--paper-3); color: var(--ink); font-family: var(--font-ui); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-align: left; text-transform: uppercase; }
  .citation-item td { white-space: pre-line; }
  .citation-item td.empty { color: var(--fg-3); opacity: 0.55; }
  .table-title { margin-top: 12px; color: var(--ink); font-weight: 500; }
  .structured-view { display: grid; gap: 18px; }
  .structured-group h2 { font-family: var(--font-ui); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 10px; color: var(--fg-3); }
  .structured-empty { border: 1px solid var(--border-hair); border-radius: 6px; background: var(--paper-2); color: var(--fg-3); font-family: var(--font-ui); font-size: 13px; padding: 14px; }
  .status-card { border: 1px solid var(--border-hair); border-radius: 6px; background: var(--paper-2); padding: 18px; font-family: var(--font-ui); font-size: 14px; color: var(--fg-3); }
  @media (max-width: 760px) {
    .compare-shell { padding: 24px 18px 44px; }
    .page-head { grid-template-columns: 1fr; }
    .page-head h1 { font-size: 34px; overflow-wrap: anywhere; }
    .head-actions { justify-content: stretch; flex-wrap: wrap; }
    .head-actions .btn { flex: 1 1 130px; justify-content: center; min-width: 0; }
    .compare-grid { grid-template-columns: 1fr; }
    .col-head.label, .diff-cell.label { display: none; }
    .diff-cell.current, .diff-cell.draft { justify-content: flex-start; text-align: left; border-right: 0; }
    .diff-cell.current::before { content: attr(data-label) " current"; flex: 0 1 46%; min-width: 0; font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; margin-right: auto; overflow-wrap: anywhere; }
    .diff-cell.draft::before { content: attr(data-label) " draft"; flex: 0 1 46%; min-width: 0; font-family: var(--font-ui); font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; margin-right: auto; overflow-wrap: anywhere; }
    .citation-grid { grid-template-columns: 1fr; }
    .view-toggle { width: 100%; }
    .view-toggle button { flex: 1; }
  }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useMemo, useState } = React;

function formatValue(value, label) {
  if (value === null || value === undefined || value === '') {
    return 'pending';
  }
  if (label.toLowerCase().includes('overlap') && Number.isFinite(Number(value))) {
    return `${Number(value).toFixed(0)} m2`;
  }
  return String(value);
}

function markerText(status, side) {
  if (status === 'same') return 'SAME';
  if (status === 'pending') return 'PENDING';
  if (status === 'source') return 'SOURCE';
  return side === 'current' ? 'WAS' : 'NOW';
}

function Header({ pid }) {
  const parcel3dHref = pid ? `/parcel-3d?pid=${encodeURIComponent(pid)}` : '/parcel-3d';
  const stormSurgeHref = pid ? `/storm-surge?pid=${encodeURIComponent(pid)}` : '/storm-surge';
  return (
    <header className="app-header">
      <img src="../../assets/logo-island-needle.svg" alt="Modern Democracy" className="wm" />
      <nav>
        <a href="/parcel-lookup">Parcel lookup</a>
        <a className="active" href="/zoning-comparison">Compare bylaws</a>
        <a href="/council-meetings">Council meetings</a>
        <a href="/document-import">Document import</a>
        <a href="/restriction-stack">View Spatial Restrictions</a>
        <a href="/provisions-comparison">Compare provisions</a>
        <a href="/city-view">Map</a>
        <a href={parcel3dHref}>3D view</a>
        <a href={stormSurgeHref}>Storm surge</a>
      </nav>
    </header>
  );
}

function humanizeColumnId(columnId) {
  return String(columnId || 'Column')
    .replace(/_/g, ' ')
    .replace(/\b\w/g, (letter) => letter.toUpperCase());
}

function tableColumns(table) {
  const columns = Array.isArray(table.columns) ? [...table.columns] : [];
  if (columns.length) {
    return columns.map((column, index) => ({
      columnId: column.columnId || `column-${index}`,
      columnLabel: column.columnLabel || humanizeColumnId(column.columnId),
      columnOrder: Number.isFinite(Number(column.columnOrder)) ? Number(column.columnOrder) : index,
    }));
  }

  const byId = new Map();
  (table.rows || []).forEach((row) => {
    (row.cells || []).forEach((cell, index) => {
      const columnId = cell.columnId || `column-${index}`;
      if (!byId.has(columnId)) {
        byId.set(columnId, {
          columnId,
          columnLabel: cell.columnLabel || humanizeColumnId(columnId),
          columnOrder: Number.isFinite(Number(cell.columnOrder)) ? Number(cell.columnOrder) : index,
        });
      }
    });
  });
  return [...byId.values()].sort((a, b) => a.columnOrder - b.columnOrder || a.columnId.localeCompare(b.columnId));
}

function rowCellsByColumn(row) {
  const byColumn = new Map();
  (row.cells || []).forEach((cell) => {
    const columnId = cell.columnId || '';
    if (!columnId) return;
    const prior = byColumn.get(columnId);
    const text = cell.text || '';
    if (!prior) {
      byColumn.set(columnId, text);
      return;
    }
    byColumn.set(columnId, [prior, text].filter(Boolean).join('\n'));
  });
  return byColumn;
}

const MAX_RESOLVE_DEPTH = 4;

function ResolvedReferences({ references, depth, visited, keyPrefix }) {
  if (depth >= MAX_RESOLVE_DEPTH) {
    return <div className="resolved"><div className="resolved-cap">Further references collapsed (depth limit reached).</div></div>;
  }
  return (
    <div className="resolved">
      {(references || []).map((reference) => {
        const cycleKey = reference.zoneCode || 'ref';
        if (visited.has(cycleKey)) {
          return (
            <div className="resolved-cap" key={`${keyPrefix}-cycle-${cycleKey}`}>
              References to {cycleKey} already shown above.
            </div>
          );
        }
        const nextVisited = new Set(visited);
        nextVisited.add(cycleKey);
        return (
          <React.Fragment key={`${keyPrefix}-${cycleKey}`}>
            {(reference.sections || []).map((section, index) => {
              const sectionKey = `${keyPrefix}-${cycleKey}-${section.sectionId || index}-${index}`;
              return (
                <div className="resolved-section" key={sectionKey}>
                  <div className="title">
                    {section.label} {section.title}
                    <span className="provenance">via {cycleKey} {section.label || ''}</span>
                  </div>
                  {(section.clauses || []).map((clause, clauseIndex) => (
                    <Clause
                      clause={clause}
                      depth={depth + 1}
                      visited={nextVisited}
                      keyPrefix={`${sectionKey}-clause-${clauseIndex}`}
                      key={`${sectionKey}-clause-${clauseIndex}`}
                    />
                  ))}
                  <SectionTables section={section} keyPrefix={sectionKey} />
                </div>
              );
            })}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function Clause({ clause, depth = 0, visited, keyPrefix }) {
  const hasReferences = Boolean(clause.references?.length);
  const visitedSet = visited || new Set();
  const [expanded, setExpanded] = useState(false);
  return (
    <div className={`clause ${hasReferences ? 'has-ref' : ''}`}>
      {clause.label && <span className="clause-label">{clause.label}</span>}
      {hasReferences ? (
        <button
          type="button"
          className="clause-toggle"
          aria-expanded={expanded}
          onClick={() => setExpanded(!expanded)}
        >
          <span className="chev">▶</span>{clause.text || ''}
        </button>
      ) : (
        <span className="clause-text">{clause.text || ''}</span>
      )}
      {hasReferences && expanded && (
        <ResolvedReferences
          references={clause.references}
          depth={depth}
          visited={visitedSet}
          keyPrefix={keyPrefix || 'ref'}
        />
      )}
    </div>
  );
}

function SectionTables({ section, keyPrefix }) {
  return (
    <>
      {(section.tables || []).map((table, tableIndex) => (
        <div key={`${keyPrefix}-table-${tableIndex}`}>
          {table.title && <div className="table-title">{table.title}</div>}
          <table>
            <thead>
              <tr>
                {tableColumns(table).map((column) => (
                  <th key={`${keyPrefix}-table-${tableIndex}-head-${column.columnId}`}>
                    {column.columnLabel || humanizeColumnId(column.columnId)}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {(table.rows || []).map((row, rowIndex) => {
                const cellsByColumn = rowCellsByColumn(row);
                return (
                  <tr key={`${keyPrefix}-table-${tableIndex}-row-${rowIndex}`}>
                    {tableColumns(table).map((column) => {
                      const text = cellsByColumn.get(column.columnId) || '';
                      return (
                        <td className={text ? '' : 'empty'} key={`${keyPrefix}-table-${tableIndex}-row-${rowIndex}-cell-${column.columnId}`}>{text}</td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ))}
    </>
  );
}

function CitationList({ title, sections }) {
  return (
    <section className="citation-card">
      <h2>{title}</h2>
      <div className="citation-list">
        {sections.length === 0 && <div className="citation-item">Zone-section citations pending for this parcel zone.</div>}
        {sections.map((section, index) => (
          <article className="citation-item" key={`${section.sectionId}-${index}`}>
            <div className="title">{section.label} {section.title}</div>
            <div className="meta">{section.filePath || 'source path pending'}</div>
            <div className="meta">Bylaw page {section.citations?.bylaw_page_start || 'pending'}</div>
            {(section.clauses || []).map((clause, clauseIndex) => (
              <Clause clause={clause} depth={0} visited={new Set()} keyPrefix={`${section.sectionId}-clause-${clauseIndex}`} key={`${section.sectionId}-clause-${clauseIndex}`} />
            ))}
            <SectionTables section={section} keyPrefix={section.sectionId} />
          </article>
        ))}
      </div>
    </section>
  );
}

function ComparisonRows({ rows, leftLabel = 'Original bylaw', rightLabel = 'Updated draft bylaw' }) {
  return (
    <div className="compare-grid">
      <div className="col-head current"><span className="dot" style={{background:'var(--brick)'}}></span><span className="name">{leftLabel}</span><span className="sub">comparison source</span></div>
      <div className="col-head label"><span className="name">Field</span></div>
      <div className="col-head draft"><span className="dot" style={{background:'var(--ochre)'}}></span><span className="name">{rightLabel}</span><span className="sub">July 30 2026 update</span></div>
      {rows.map((row, index) => (
        <React.Fragment key={`${row.label}-${index}`}>
          <div className={`diff-cell current ${row.current == null ? 'empty' : ''} ${row.numericChanged ? 'numeric-changed' : ''}`} data-label={row.label}>
            <span className={`value ${String(row.current || '').includes('\n') ? 'multi-line' : ''}`}>{formatValue(row.current, row.label)}</span>
            <span className={`marker ${row.status}`}>{markerText(row.status, 'current')}</span>
          </div>
          <div className="diff-cell label">{row.label}</div>
          <div className={`diff-cell draft ${row.draft == null ? 'empty' : ''} ${row.numericChanged ? 'numeric-changed' : ''}`} data-label={row.label}>
            <span className={`marker ${row.status}`}>{markerText(row.status, 'draft')}</span>
            <span className={`value ${String(row.draft || '').includes('\n') ? 'multi-line' : ''}`}>{formatValue(row.draft, row.label)}</span>
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function StructuredView({ structuredData }) {
  const groups = structuredData?.groups || [];
  if (!groups.length) {
    return <div className="structured-empty">Structured data is pending for this parcel comparison.</div>;
  }
  return (
    <div className="structured-view">
      {groups.map((group) => (
        <section className="structured-group" key={group.key}>
          <h2>{group.title}</h2>
          {group.rows?.length
            ? <ComparisonRows rows={group.rows} />
            : <div className="structured-empty">No structured rows found.</div>}
        </section>
      ))}
    </div>
  );
}

function App() {
  const params = new URLSearchParams(window.location.search);
  const pid = params.get('pid') || '';
  const [comparison, setComparison] = useState(null);
  const [status, setStatus] = useState(pid ? 'Loading zoning comparison.' : 'No PID was supplied. Start from parcel lookup or city view.');
  const [viewMode, setViewMode] = useState('raw');
  const [comparisonMode, setComparisonMode] = useState('current-updated');

  useEffect(() => { lucide.createIcons(); });

  useEffect(() => {
    if (!pid) return;
    let cancelled = false;
    async function loadComparison() {
      try {
        const response = await fetch(`/api/zoning-comparison/${encodeURIComponent(pid)}?mode=${encodeURIComponent(comparisonMode)}`);
        if (!response.ok) {
          throw new Error(`Zoning comparison failed with HTTP ${response.status}.`);
        }
        const payload = await response.json();
        if (!cancelled) {
          setComparison(payload);
          setStatus(`Loaded comparison for PID ${payload.pid}.`);
        }
      } catch (error) {
        if (!cancelled) {
          setStatus(error.message || 'Zoning comparison failed.');
        }
      }
    }
    loadComparison();
    return () => { cancelled = true; };
  }, [pid, comparisonMode]);

  const counts = useMemo(() => {
    const rows = comparison?.rows || [];
    return {
      changed: rows.filter((row) => row.status === 'changed').length,
      same: rows.filter((row) => row.status === 'same').length,
      pending: rows.filter((row) => row.status === 'pending').length,
      source: rows.filter((row) => row.status === 'source').length,
    };
  }, [comparison]);

  const structuredCounts = useMemo(() => {
    const rows = (comparison?.structuredData?.groups || []).flatMap((group) => group.rows || []);
    return {
      changed: rows.filter((row) => row.status === 'changed').length,
      same: rows.filter((row) => row.status === 'same').length,
      total: rows.length,
    };
  }, [comparison]);

  return (
    <div className="app">
      <Header pid={pid} />
      <main className="compare-shell">
        <div className="page-head">
          <div>
            <div className="eyebrow">Comparison</div>
            <h1>{comparison?.address?.label || (pid ? `PID ${pid}` : 'Zoning comparison')}</h1>
            <p>{comparison ? comparison.citations?.note : status}</p>
          </div>
          <div className="head-actions">
            <a className="btn btn-secondary" href="/parcel-lookup"><i data-lucide="search" style={{width:14,height:14}}></i> Lookup</a>
            {pid && <a className="btn btn-primary" href={`/map-explorer?pid=${encodeURIComponent(pid)}`}><i data-lucide="map" style={{width:14,height:14}}></i> Map</a>}
            {pid && <a className="btn btn-primary" href={`/restriction-stack?pid=${encodeURIComponent(pid)}`}><i data-lucide="layers-3" style={{width:14,height:14}}></i> View Spatial Restrictions</a>}
            {pid && <a className="btn btn-primary" href={`/parcel-3d?pid=${encodeURIComponent(pid)}`}><i data-lucide="box" style={{width:14,height:14}}></i> 3D view</a>}
          </div>
        </div>

        {!comparison && <div className="status-card">{status}</div>}
        {comparison && (
          <>
            <div className="summary-bar">
              <div className="summary-stat changed"><div className="n">{counts.changed}</div><div className="l">Changed</div></div>
              <div className="summary-stat"><div className="n">{counts.source}</div><div className="l">Source facts</div></div>
              <div className="summary-stat pending"><div className="n">{counts.pending}</div><div className="l">Pending</div></div>
              <div className="summary-stat"><div className="n" style={{color:'var(--fg-3)'}}>{counts.same}</div><div className="l">Unchanged</div></div>
              {viewMode === 'structured' && <div className="summary-stat"><div className="n" style={{color:'var(--fg-3)'}}>{structuredCounts.total}</div><div className="l">Structured rows</div></div>}
              <div style={{marginLeft:'auto', display:'flex', alignItems:'center', gap:12, flexWrap:'wrap'}}>
                <div className="view-toggle" aria-label="Comparison view">
                  <button type="button" className={viewMode === 'raw' ? 'active' : ''} onClick={() => setViewMode('raw')}>Raw bylaw</button>
                  <button type="button" className={viewMode === 'structured' ? 'active' : ''} onClick={() => setViewMode('structured')}>Structured data</button>
                </div>
                <div className="view-toggle" aria-label="Bylaw pair">
                  <button type="button" className={comparisonMode === 'current-updated' ? 'active' : ''} onClick={() => setComparisonMode('current-updated')}>Original bylaw vs updated draft</button>
                  <button type="button" className={comparisonMode === 'original-updated' ? 'active' : ''} onClick={() => setComparisonMode('original-updated')}>Original draft vs updated draft</button>
                </div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:12, color:'var(--fg-3)'}}>Resolution: {comparison.resolution?.status || 'pending'}</div>
              </div>
            </div>
            <ComparisonRows rows={comparison.rows} leftLabel={comparison.comparison?.left} rightLabel={comparison.comparison?.right} />
            {viewMode === 'raw' && (
              <div className="citation-grid">
                <CitationList title={comparison.comparison?.left || 'Original bylaw'} sections={comparison.citations?.current || []} />
                <CitationList title={comparison.comparison?.right || 'Updated draft bylaw'} sections={comparison.citations?.draft || []} />
              </div>
            )}
            {viewMode === 'structured' && <StructuredView structuredData={comparison.structuredData} />}
          </>
        )}
      </main>
      <footer className="app-footer">
        <div className="row">
          <div>Compare current and draft Charlottetown zoning data by parcel.</div>
          <div style={{marginLeft:'auto'}}>Source: <a>github.com/Modern-Democracy/mdopendata</a></div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>

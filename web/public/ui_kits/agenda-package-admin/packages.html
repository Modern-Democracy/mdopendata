<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Agenda packages | Administration</title><link rel="stylesheet" href="admin.css"></head>
<body><header><div><div class="meta">Document ingestion administration</div><h1>Agenda packages</h1></div><nav><a aria-current="page" href="/admin/agenda-packages">Packages</a><a href="/admin/page-templates">Templates</a><a href="/agenda-package-ingestion">Upload package</a></nav></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Filter by package, municipality, or status"><span class="count" id="count">Loading</span></div><div class="table-wrap"><table><thead><tr><th>Package</th><th>Status</th><th>Pages</th><th>Documents</th><th>Uploaded</th><th>Links</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const rows=document.getElementById('rows'), search=document.getElementById('search'), count=document.getElementById('count'); let packages=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const date=v=>v?new Date(v).toLocaleDateString():'Not recorded';
function render(){const q=search.value.toLowerCase(), shown=packages.filter(p=>JSON.stringify(p).toLowerCase().includes(q)); count.textContent=`${shown.length} of ${packages.length} packages`; rows.innerHTML=shown.map(p=>`<tr><td><strong>${esc(p.title||p.packageKey)}</strong><div class="meta">${esc(p.municipality||'Unknown municipality')} · ${esc(p.packageKey)}</div></td><td><span class="badge">${esc(p.status)}</span>${p.unresolvedTemplateCount?`<div class="warning">${p.unresolvedTemplateCount} unresolved</div>`:''}</td><td>${p.pageCount??'—'}</td><td>${p.documentCount}</td><td>${date(p.uploadedAt)}</td><td><a href="/agenda-package-ingestion?package=${encodeURIComponent(p.packageKey)}">Package workflow</a><br><a href="/council-meetings">Meeting browser</a></td></tr>`).join('')||'<tr><td colspan="6">No packages found.</td></tr>';}
search.addEventListener('input',render); fetch('/api/admin/agenda-packages').then(r=>r.json().then(x=>{if(!r.ok)throw Error(x.error);return x})).then(x=>{packages=x.packages;render()}).catch(e=>{count.textContent='Load failed';rows.innerHTML=`<tr><td colspan="6" class="error">${esc(e.message)}</td></tr>`});
</script></body></html>

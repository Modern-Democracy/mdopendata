<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Page templates | Administration</title><link rel="stylesheet" href="admin.css"></head>
<body><header><div><div class="meta">Document ingestion administration</div><h1>Page templates</h1></div><nav><a href="/admin/agenda-packages">Packages</a><a aria-current="page" href="/admin/page-templates">Templates</a><a href="/agenda-package-ingestion">Upload package</a></nav></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Filter by template, package, or status"><span class="count" id="count">Loading</span></div><div id="list"></div></main>
<script>
const list=document.getElementById('list'), search=document.getElementById('search'), count=document.getElementById('count'); let templates=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const pct=v=>v==null?'—':`${Math.round(Number(v)*100)}%`;
function render(){const q=search.value.toLowerCase(), shown=templates.filter(t=>JSON.stringify(t).toLowerCase().includes(q)); count.textContent=`${shown.length} of ${templates.length} templates`; list.innerHTML=shown.map(t=>`<details class="template"><summary><strong>${esc(t.name)}</strong> <span class="badge">${esc(t.status)}</span><div class="meta">${esc(t.templateKey)} · ${t.matchCount} matching pages</div></summary><div class="template-body"><p>${esc(t.description||'No description.')}</p><div class="table-wrap"><table><thead><tr><th>Preview</th><th>Package</th><th>Page</th><th>Confidence</th><th>Review</th></tr></thead><tbody>${t.matches.map(m=>`<tr><td><a href="/api/document-ingestion/packages/${encodeURIComponent(m.packageKey)}/pages/${m.pageNumber}/image" target="_blank"><img class="thumb" loading="lazy" src="/api/document-ingestion/packages/${encodeURIComponent(m.packageKey)}/pages/${m.pageNumber}/image" alt="Page ${m.pageNumber}"></a></td><td><a href="/agenda-package-ingestion?package=${encodeURIComponent(m.packageKey)}">${esc(m.packageTitle||m.packageKey)}</a><div class="meta">${esc(m.packageKey)}</div></td><td>${m.pageNumber}</td><td>${pct(m.confidence)}</td><td><span class="badge">${esc(m.reviewStatus)}</span></td></tr>`).join('')||'<tr><td colspan="5">No matching package pages.</td></tr>'}</tbody></table></div></div></details>`).join('')||'<p>No templates found.</p>';}
search.addEventListener('input',render); fetch('/api/admin/page-templates').then(r=>r.json().then(x=>{if(!r.ok)throw Error(x.error);return x})).then(x=>{templates=x.templates;render()}).catch(e=>{count.textContent='Load failed';list.innerHTML=`<p class="error">${esc(e.message)}</p>`});
</script></body></html>

<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;
const { AgendaTree, allItems } = window.CouncilAgendaTree;
const PAGE_TYPES = ["meeting_agenda", "resolution_cover_page", "resolution_text_page", "meeting_minutes", "committee_report", "development_permit_application", "staff_report", "map_or_plan", "correspondence", "financial_report", "other"];
const DOCUMENT_CATEGORY_GROUPS = [
  ["Municipal Sources", [["agenda", "Agenda"], ["minutes", "Minutes"], ["monthly_reports", "Monthly reports"], ["committee_report_cover", "Committee report cover"], ["resolutions", "Resolutions"], ["readings", "Readings"]]],
  ["Received Material", [["emails", "Emails"], ["document_submissions", "Document submissions"], ["applicant_submissions", "Applicant submissions"], ["developer_submissions", "Developer submissions"], ["external_body_submissions", "External body submissions"], ["public_submissions", "Public submissions"]]],
  ["Other", [["uncategorized", "Uncategorized"]]],
];
const DOCUMENT_CATEGORIES = DOCUMENT_CATEGORY_GROUPS.flatMap((group) => group[1]);
const DEFAULT_AGENDA_TITLE_OVERRIDES = { "agenda-2": "Council Meeting Agenda - May 12, 2026" };
const STORE_KEY = "mdopendata-document-import-qa";

function fetchJson(url) {
  return fetch(url).then((response) => {
    if (!response.ok) throw new Error(`Request failed: ${response.status}`);
    return response.json();
  });
}
function pageRange(document) {
  if (Array.isArray(document?.page_numbers) && document.page_numbers.length) {
    return [...document.page_numbers].sort((a, b) => a - b);
  }
  const start = Number(document?.page_start || 1);
  const end = Number(document?.page_end || start);
  return Array.from({ length: Math.max(0, end - start + 1) }, (_, index) => start + index);
}
function pageKey(page) { return `package:${page}`; }
function normalizeType(value) { return String(value || "").replaceAll("-", "_"); }
function initialQa(documents) {
  const pageTags = {};
  const documentNotes = {};
  const documentText = {};
  for (const document of documents) {
    for (const page of pageRange(document)) {
      pageTags[pageKey(page)] = normalizeType(document.template_type || document.document_type || "other");
    }
    documentNotes[document.document_id] = "";
    documentText[document.document_id] = "";
  }
  return { pageTags, pageComments: {}, documentNotes, documentText, localDocuments: [], agendaItemTitles: DEFAULT_AGENDA_TITLE_OVERRIDES, templateInstructions: {}, updatedRecords: {} };
}
function hydrateQa(documents) {
  const base = initialQa(documents);
  try {
    const stored = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    return {
      pageTags: { ...base.pageTags, ...(stored.pageTags || {}) },
      pageComments: { ...base.pageComments, ...(stored.pageComments || {}) },
      documentNotes: { ...base.documentNotes, ...(stored.documentNotes || {}) },
      documentText: { ...base.documentText, ...(stored.documentText || {}) },
      localDocuments: stored.localDocuments || [],
      agendaItemTitles: { ...base.agendaItemTitles, ...(stored.agendaItemTitles || {}) },
      templateInstructions: { ...base.templateInstructions, ...(stored.templateInstructions || {}) },
      updatedRecords: { ...base.updatedRecords, ...(stored.updatedRecords || {}) },
    };
  } catch {
    return base;
  }
}
function Header() {
  return <header className="app-header"><img src="../../assets/logo-island-needle.svg" alt="Modern Democracy" className="wm" /><nav><a href="/parcel-lookup">Parcel lookup</a><a href="/zoning-comparison">Compare bylaws</a><a href="/council-meetings">Council meetings</a><a className="active" href="/document-import">Document import</a><a href="/restriction-stack">View Spatial Restrictions</a><a href="/city-view">Map</a></nav></header>;
}
function documentsForAgendaItem(documents, agendaItemId) {
  return documents.filter((document) => document.document_id === agendaItemId || document.agenda_item_id === agendaItemId || (document.agenda_item_ids || []).includes(agendaItemId));
}
function primaryAgendaItemId(document) {
  return document?.agenda_item_id || document?.agenda_item_ids?.[0] || "";
}
function businessItemOptions(payload) {
  return payload?.businessItems || [];
}
function businessItemForDocument(document, payload) {
  const businessId = document?.business_item_id || "";
  return businessItemOptions(payload).find((item) => item.business_item_id === businessId) || null;
}
function agendaDocumentSets(documents, agendaItems, qa) {
  const agendaById = new Map(agendaItems.map((item) => [item.id, item]));
  const sets = new Map();
  const addSet = (id) => {
    const agenda = agendaById.get(id) || { id, label: "", title: id || "Unlinked" };
    if (!sets.has(id)) sets.set(id, { id, agenda, documents: [] });
    return sets.get(id);
  };
  for (const document of documents) {
    const agendaId = primaryAgendaItemId(document) || "unlinked";
    addSet(agendaId).documents.push(document);
  }
  return [...sets.values()].sort((a, b) => {
    const firstPage = Math.min(...a.documents.map((document) => document.page_start || 9999));
    const secondPage = Math.min(...b.documents.map((document) => document.page_start || 9999));
    return firstPage - secondPage;
  }).map((set) => ({ ...set, title: displayTitleForAgendaItem(set.agenda, qa) || set.agenda.title || set.id }));
}
function Toolbar({ meeting, selectedPages, selectionMode, setSelectionMode, tagSelected, clearSelection, exportFeedback }) {
  return <div className="toolbar"><div className="title">{meeting?.title || "Document Import QA"}</div><button type="button" className={`btn-small ${selectionMode ? "active" : ""}`} onClick={() => setSelectionMode(!selectionMode)}><i data-lucide="check-square"></i> Select pages</button><select className="select" style={{width: 230}} onChange={(event) => { if (event.target.value) tagSelected(event.target.value); event.target.value = ""; }}><option value="">Tag selected pages</option>{PAGE_TYPES.map((type) => <option value={type} key={type}>{type.replaceAll("_", " ")}</option>)}</select><button type="button" className="btn-small" onClick={clearSelection}>Clear {selectedPages.length}</button><button type="button" className="btn-small primary" onClick={exportFeedback}><i data-lucide="download"></i> Export feedback</button></div>;
}
function documentForPage(documents, page) {
  return documents.find((document) => pageRange(document).includes(page)) || documents[0] || null;
}
function markRecordUpdated(state, id, message = "Record updated") {
  if (!id) return state;
  return { ...state, updatedRecords: { ...(state.updatedRecords || {}), [id]: { message, at: new Date().toISOString() } } };
}
function removePagesFromDocument(document, pagesToRemove) {
  const remaining = pageRange(document).filter((page) => !pagesToRemove.has(page));
  if (!remaining.length) return { ...document, page_start: null, page_end: null, page_count: 0, page_numbers: [] };
  return { ...document, page_start: remaining[0], page_end: remaining.at(-1), page_count: remaining.length, page_numbers: remaining };
}
function displayTitleForAgendaItem(item, qa) {
  return qa?.agendaItemTitles?.[item?.id] || item?.title || "";
}
function categoryOptions() {
  return DOCUMENT_CATEGORY_GROUPS.map(([group, options]) => <optgroup label={group} key={group}>{options.map(([value, label]) => <option value={value} key={value}>{label}</option>)}</optgroup>);
}
function PageCard({ page, document, selected, toggleSelected, tag, setTag, comment, setComment }) {
  return <article id={`package-page-${page}`} data-page={page} className={`page-card ${selected ? "selected" : ""}`}><div className="page-head"><input type="checkbox" checked={selected} onChange={() => toggleSelected(page)} aria-label={`Select page ${page}`} /><div><h2>Package page {page}</h2><div className="page-meta">{document?.title || "Unassigned package page"} | {document?.document_id || "unassigned"} | pages {document?.page_start || page}-{document?.page_end || page}</div></div><span className="tag">{(tag || "other").replaceAll("_", " ")}</span></div><div className="field-row" style={{marginBottom: 10}}><select className="select" style={{width: 260}} value={tag || "other"} onChange={(event) => setTag(page, event.target.value)}>{PAGE_TYPES.map((type) => <option value={type} key={type}>{type.replaceAll("_", " ")}</option>)}</select><input className="input" style={{flex: 1}} value={comment || ""} onChange={(event) => setComment(page, event.target.value)} placeholder="Page interpretation comment" /></div><img loading="lazy" alt={`Package page ${page}`} src={`/api/council-meetings/current/page-image?documentId=package&page=${page}`} /></article>;
}
function PageListing({ documents, pageCount, categoryFilter, setActivePage, selectedPages, toggleSelected, qa, setQa }) {
  const scrollRef = useRef(null);
  if (!documents.length) return <main className="pages">No package documents loaded.</main>;
  const listedPages = Array.from({ length: pageCount }, (_, index) => index + 1).filter((page) => {
    const document = documentForPage(documents, page);
    return !categoryFilter || document?.document_category === categoryFilter;
  });
  const setTag = (page, tag) => setQa((current) => ({ ...current, pageTags: { ...current.pageTags, [pageKey(page)]: tag } }));
  const setComment = (page, comment) => setQa((current) => ({ ...current, pageComments: { ...current.pageComments, [pageKey(page)]: comment } }));
  useEffect(() => {
    const root = scrollRef.current;
    if (!root) return undefined;
    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible[0]) setActivePage(Number(visible[0].target.dataset.page));
    }, { root, rootMargin: "-10% 0px -70% 0px", threshold: 0 });
    root.querySelectorAll("[data-page]").forEach((node) => observer.observe(node));
    return () => observer.disconnect();
  }, [pageCount, categoryFilter, setActivePage]);
  return <main className="pages" ref={scrollRef}><div className="page-list">{listedPages.map((page) => <PageCard key={page} page={page} document={documentForPage(documents, page)} selected={selectedPages.includes(page)} toggleSelected={toggleSelected} tag={qa.pageTags[pageKey(page)]} setTag={setTag} comment={qa.pageComments[pageKey(page)]} setComment={setComment} />)}</div></main>;
}
function EditorPanel({ document, documents, activePage, agendaItem, selectedPages, setSelectedPages, qa, setQa, setActiveId, scrollToPage, agendaItems, payload }) {
  const [targetDocumentId, setTargetDocumentId] = useState("");
  const [newTitle, setNewTitle] = useState("");
  const [loadStatus, setLoadStatus] = useState("");
  const [pageNumberDraft, setPageNumberDraft] = useState("");
  useEffect(() => { setTargetDocumentId(document?.document_id || ""); }, [document?.document_id]);
  useEffect(() => { setPageNumberDraft(document ? pageRange(document).join(", ") : ""); }, [document?.document_id]);
  if (!document) return <aside className="edit">No document selected.</aside>;
  const selectedText = selectedPages.length ? selectedPages.join(", ") : "none";
  const markdown = qa.documentText[document.document_id] || "";
  const agendaTitle = displayTitleForAgendaItem(agendaItem, qa);
  const currentBusinessItem = businessItemForDocument(document, payload);
  const templateRecord = qa.templateInstructions[document.document_id] || { region: { x: "", y: "", width: "", height: "" }, template_category_type: document.template_type || "", title_template: "", extraction_instructions: "", agenda_fields: "", toc_fields: "", processing_actions: "" };
  const updateDocumentPatch = (patch, message = "Record updated") => setQa((current) => {
    const existing = current.localDocuments.find((candidate) => candidate.document_id === document.document_id) || document;
    const localDocuments = current.localDocuments.some((candidate) => candidate.document_id === document.document_id)
      ? current.localDocuments.map((candidate) => candidate.document_id === document.document_id ? { ...candidate, ...patch } : candidate)
      : [...current.localDocuments, { ...existing, ...patch }];
    return markRecordUpdated({ ...current, localDocuments }, document.document_id, message);
  });
  const setMarkdown = (text) => setQa((current) => markRecordUpdated({ ...current, documentText: { ...current.documentText, [document.document_id]: text } }, document.document_id, "Document text updated"));
  const setNote = (text) => setQa((current) => markRecordUpdated({ ...current, documentNotes: { ...current.documentNotes, [document.document_id]: text } }, document.document_id, "Parser feedback updated"));
  const setAgendaTitle = (title) => {
    if (!agendaItem?.id) return;
    setQa((current) => ({ ...current, agendaItemTitles: { ...current.agendaItemTitles, [agendaItem.id]: title } }));
  };
  const setTemplateField = (field, value) => setQa((current) => {
    const currentTemplate = current.templateInstructions[document.document_id] || templateRecord;
    return { ...current, templateInstructions: { ...current.templateInstructions, [document.document_id]: { ...currentTemplate, [field]: value } } };
  });
  const setTemplateRegion = (field, value) => setQa((current) => {
    const currentTemplate = current.templateInstructions[document.document_id] || templateRecord;
    return { ...current, templateInstructions: { ...current.templateInstructions, [document.document_id]: { ...currentTemplate, region: { ...(currentTemplate.region || {}), [field]: value } } } };
  });
  const setCategory = (category) => updateDocumentPatch({ document_category: category }, "Document category updated");
  const setAgendaBinding = (agendaItemId) => updateDocumentPatch({ agenda_item_id: agendaItemId, agenda_item_ids: agendaItemId ? [agendaItemId] : [] }, "Agenda binding updated");
  const setBusinessBinding = (businessItemId) => updateDocumentPatch({ business_item_id: businessItemId || null }, "Business item binding updated");
  const commitPageNumbers = (value) => {
    const pages = value.split(",").map((candidate) => Number(candidate.trim())).filter(Boolean).sort((a, b) => a - b);
    updateDocumentPatch({ page_numbers: pages, page_start: pages[0] || null, page_end: pages.at(-1) || null, page_count: pages.length }, "Page range updated");
  };
  const createDocument = () => {
    if (!selectedPages.length) return;
    const sorted = [...selectedPages].sort((a, b) => a - b);
    const selectedSet = new Set(sorted);
    const id = `local-${Date.now()}`;
    const next = { document_id: id, source_document_id: "package", title: newTitle.trim() || `Review document pages ${sorted[0]}-${sorted.at(-1)}`, document_type: "review_created", document_category: "uncategorized", agenda_item_id: primaryAgendaItemId(document) || null, agenda_item_ids: primaryAgendaItemId(document) ? [primaryAgendaItemId(document)] : [], business_item_id: document.business_item_id || null, page_start: sorted[0], page_end: sorted.at(-1), page_count: sorted.length, page_numbers: sorted };
    setQa((current) => {
      const touched = new Set([id]);
      const localById = new Map(current.localDocuments.map((candidate) => [candidate.document_id, candidate]));
      for (const candidate of documents) {
        if (candidate.document_id === id) continue;
        if (!pageRange(candidate).some((page) => selectedSet.has(page))) continue;
        touched.add(candidate.document_id);
        localById.set(candidate.document_id, removePagesFromDocument(candidate, selectedSet));
      }
      localById.set(id, next);
      let updated = { ...current, localDocuments: [...localById.values()], documentNotes: { ...current.documentNotes, [id]: "Created during import QA." }, documentText: { ...current.documentText, [id]: "" } };
      for (const recordId of touched) updated = markRecordUpdated(updated, recordId, recordId === id ? "Document created" : "Pages reassigned");
      return updated;
    });
    setActiveId(id);
    scrollToPage(sorted[0]);
    setSelectedPages([]);
    setNewTitle("");
  };
  const movePages = () => {
    if (!selectedPages.length || !targetDocumentId) return;
    const sorted = [...selectedPages].sort((a, b) => a - b);
    setQa((current) => {
      const existing = current.localDocuments.find((candidate) => candidate.document_id === targetDocumentId) || documents.find((candidate) => candidate.document_id === targetDocumentId);
      const replacementPages = [...new Set([...(existing?.page_numbers || pageRange(existing)), ...sorted])].sort((a, b) => a - b);
      const replacement = { ...(existing || {}), document_id: targetDocumentId, page_start: replacementPages[0], page_end: replacementPages.at(-1), page_count: replacementPages.length, page_numbers: replacementPages };
      const localDocuments = current.localDocuments.some((candidate) => candidate.document_id === targetDocumentId) ? current.localDocuments.map((candidate) => candidate.document_id === targetDocumentId ? replacement : candidate) : [...current.localDocuments, { ...replacement, title: `${existing?.title || targetDocumentId} QA page move`, document_type: existing?.document_type || "review_adjusted" }];
      return markRecordUpdated({ ...current, localDocuments }, targetDocumentId, "Pages moved");
    });
  };
  const loadExtractedText = async () => {
    setLoadStatus("Loading extracted text.");
    const pages = pageRange(document);
    const results = await Promise.all(pages.map((page) => fetchJson(`/api/council-meetings/current/source-page?documentId=package&page=${page}`).then((payload) => `## Package page ${page}\n\n${payload.text || ""}`).catch((error) => `## Package page ${page}\n\nUnable to load page text: ${error.message}`)));
    setMarkdown(results.join("\n\n"));
    setLoadStatus(`Loaded ${results.length} page source${results.length === 1 ? "" : "s"}.`);
  };
  const recordCue = qa.updatedRecords?.[document.document_id];
  return <aside className="edit"><section className="panel"><h2>Agenda Item</h2><div className="document-title">{agendaTitle || "No linked agenda item"}</div><div className="document-meta">{agendaItem?.id || "unlinked"}{agendaItem?.label ? ` | ${agendaItem.label}` : ""}</div><div className="document-meta" style={{marginTop: 6}}>business: {currentBusinessItem?.business_item_id || document.business_item_id || "unlinked"}</div></section><section className={`panel ${recordCue ? "updated" : ""}`}><h2>Document Fields</h2>{recordCue ? <div className="record-cue" style={{marginBottom: 10}}>{recordCue.message} | {new Date(recordCue.at).toLocaleTimeString()}</div> : null}<div className="stats"><div className="stat"><strong>{activePage}</strong><span>active page</span></div><div className="stat"><strong>{document.page_count || pageRange(document).length}</strong><span>document pages</span></div></div><div className="field" style={{marginTop: 10}}><label>Title</label><input className="input" value={document.title || ""} onChange={(event) => updateDocumentPatch({ title: event.target.value }, "Title updated")} placeholder="Document title" /></div><div className="field"><label>Document ID</label><input className="input" value={document.document_id} readOnly /></div><div className="field"><label>Document Type</label><input className="input" value={document.document_type || ""} onChange={(event) => updateDocumentPatch({ document_type: event.target.value }, "Document type updated")} placeholder="Document type" /></div><div className="field"><label>Agenda item binding</label><select className="select" value={primaryAgendaItemId(document)} onChange={(event) => setAgendaBinding(event.target.value)}><option value="">Unlinked</option>{agendaItems.map((item) => <option value={item.id} key={item.id}>{item.label ? `${item.label} ` : ""}{displayTitleForAgendaItem(item, qa) || item.title}</option>)}</select></div><div className="field"><label>Agenda item title</label><input className="input" value={agendaTitle} onChange={(event) => setAgendaTitle(event.target.value)} placeholder="Agenda item display title" /></div><div className="field"><label>Item of business record</label><select className="select" value={document.business_item_id || ""} onChange={(event) => setBusinessBinding(event.target.value)}><option value="">Unlinked</option>{businessItemOptions(payload).map((item) => <option value={item.business_item_id} key={item.business_item_id}>{item.title}</option>)}</select></div><div className="field"><label>Document Category</label><select className="select" value={document.document_category || "uncategorized"} onChange={(event) => setCategory(event.target.value)}>{categoryOptions()}</select></div><div className="field"><label>Page numbers</label><input className="input" value={pageNumberDraft} onChange={(event) => setPageNumberDraft(event.target.value)} onBlur={(event) => commitPageNumbers(event.target.value)} onKeyDown={(event) => { if (event.key === "Enter") event.currentTarget.blur(); }} placeholder="1, 2, 3" /></div><div className="document-meta">selected {selectedText}</div></section><details className="panel"><summary><h2 style={{display: "inline"}}>Template Editor</h2></summary><div className="field" style={{marginTop: 10}}><label>Template category type</label><input className="input" value={templateRecord.template_category_type || ""} onChange={(event) => setTemplateField("template_category_type", event.target.value)} placeholder="Example: council-meeting-agenda" /></div><div className="field"><label>Programmatic title</label><input className="input" value={templateRecord.title_template || ""} onChange={(event) => setTemplateField("title_template", event.target.value)} placeholder="Example: Council Meeting Agenda - {meeting_date}" /></div><div className="field-row"><input className="input" style={{width: 75}} value={templateRecord.region?.x || ""} onChange={(event) => setTemplateRegion("x", event.target.value)} placeholder="x %" /><input className="input" style={{width: 75}} value={templateRecord.region?.y || ""} onChange={(event) => setTemplateRegion("y", event.target.value)} placeholder="y %" /><input className="input" style={{width: 75}} value={templateRecord.region?.width || ""} onChange={(event) => setTemplateRegion("width", event.target.value)} placeholder="w %" /><input className="input" style={{width: 75}} value={templateRecord.region?.height || ""} onChange={(event) => setTemplateRegion("height", event.target.value)} placeholder="h %" /></div><div className="field"><label>Extraction instructions</label><textarea className="textarea" value={templateRecord.extraction_instructions || ""} onChange={(event) => setTemplateField("extraction_instructions", event.target.value)} placeholder="Describe the selected image region and exact data to extract." /></div><div className="field"><label>Agenda field population</label><textarea className="textarea" value={templateRecord.agenda_fields || ""} onChange={(event) => setTemplateField("agenda_fields", event.target.value)} placeholder="Map extracted values to agenda item fields." /></div><div className="field"><label>TOC field population and processing actions</label><textarea className="textarea" value={templateRecord.toc_fields || ""} onChange={(event) => setTemplateField("toc_fields", event.target.value)} placeholder="Map extracted values to TOC fields and processing actions." /></div></details><section className="panel"><h2>Boundary Operations</h2><div className="field"><label>New document title</label><input className="input" value={newTitle} onChange={(event) => setNewTitle(event.target.value)} placeholder="Optional title for selected pages" /></div><div className="button-row"><button type="button" className="btn-small primary" onClick={createDocument}>Create</button></div><div className="field" style={{marginTop: 12}}><label>Move or add selected pages to document</label><select className="select" value={targetDocumentId} onChange={(event) => setTargetDocumentId(event.target.value)}>{documents.map((candidate) => <option value={candidate.document_id} key={candidate.document_id}>{candidate.title}</option>)}</select></div><button type="button" className="btn-small" onClick={movePages}>Apply page move</button></section><section className="panel"><h2>Document Markdown</h2><div className="button-row" style={{marginBottom: 10}}><button type="button" className="btn-small" onClick={loadExtractedText}>Load extracted text</button><span className="muted">{loadStatus}</span></div><textarea className="textarea markdown-editor" value={markdown} onChange={(event) => setMarkdown(event.target.value)} placeholder="Editable markdown interpretation for this document. Use Load extracted text to seed this field from page OCR text." /></section><section className="panel"><h2>Parser Feedback</h2><textarea className="textarea" value={qa.documentNotes[document.document_id] || ""} onChange={(event) => setNote(event.target.value)} placeholder="Comment on parser errors, missed boundaries, page type mistakes, or markdown corrections." /></section></aside>;
}
function LeftNavigation({ leftMode, setLeftMode, selectedAgendaId, selectAgendaItem, payload, pageCount, activePage, scrollToPage, documents, activeDocumentId, selectDocument, categoryFilter, setCategoryFilter, qa }) {
  const agendaItems = allItems(payload);
  const documentSets = agendaDocumentSets(documents, agendaItems, qa);
  const packagePages = Array.from({ length: pageCount }, (_, index) => index + 1).filter((page) => {
    const document = documentForPage(documents, page);
    return !categoryFilter || document?.document_category === categoryFilter;
  });
  return <aside className="agenda-panel"><div className="mode-toggle" aria-label="Navigation mode" style={{marginBottom: 12}}><button type="button" className={`btn-small ${leftMode === "agenda" ? "active" : ""}`} onClick={() => setLeftMode("agenda")}>Agenda</button><button type="button" className={`btn-small ${leftMode === "package" ? "active" : ""}`} onClick={() => setLeftMode("package")}>Pages</button><button type="button" className={`btn-small ${leftMode === "documents" ? "active" : ""}`} onClick={() => setLeftMode("documents")}>Documents</button></div>{leftMode === "agenda" ? <AgendaTree selectedId={selectedAgendaId} onSelect={selectAgendaItem} payload={payload} title="Agenda" embedded titleOverrides={qa.agendaItemTitles} /> : leftMode === "documents" ? <><h2 className="section-title">Documents</h2>{documentSets.map((set) => <details className="tree-group" open key={set.id}><summary>{set.agenda.label ? `${set.agenda.label} ` : ""}{set.title}</summary><div className="tree-items">{set.documents.map((candidate) => <button type="button" key={candidate.document_id} className={`document-button ${activeDocumentId === candidate.document_id ? "active" : ""} ${qa.updatedRecords?.[candidate.document_id] ? "updated" : ""}`} onClick={() => selectDocument(candidate.document_id)}><div className="document-title">{candidate.title || candidate.document_id}</div><div className="document-meta">{candidate.document_id} | pages {pageRange(candidate).join(", ") || "none"}</div><div className="document-meta">business {candidate.business_item_id || "unlinked"}</div>{qa.updatedRecords?.[candidate.document_id] ? <div className="record-cue" style={{marginTop: 7}}>{qa.updatedRecords[candidate.document_id].message}</div> : null}</button>)}</div></details>)}</> : <><h2 className="section-title">Package Pages</h2><div className="field"><label>Filter by category</label><select className="select" value={categoryFilter} onChange={(event) => setCategoryFilter(event.target.value)}><option value="">All categories</option>{categoryOptions()}</select></div><div className="page-index">{packagePages.map((page) => <button type="button" key={page} className={activePage === page ? "active" : ""} onClick={() => scrollToPage(page)}>{page}</button>)}</div></>}</aside>;
}
function App() {
  const [payload, setPayload] = useState(null);
  const [status, setStatus] = useState("Loading import package.");
  const [activeId, setActiveId] = useState("");
  const [selectedPages, setSelectedPages] = useState([]);
  const [selectionMode, setSelectionMode] = useState(true);
  const [qa, setQa] = useState(null);
  const [selectedAgendaId, setSelectedAgendaId] = useState("");
  const [leftMode, setLeftMode] = useState("agenda");
  const [activePage, setActivePage] = useState(1);
  const [categoryFilter, setCategoryFilter] = useState("");
  const documents = useMemo(() => {
    const localPageOwners = new Set();
    for (const document of qa?.localDocuments || []) {
      for (const page of pageRange(document)) localPageOwners.add(page);
    }
    const byId = new Map((payload?.packageDocuments || []).map((document) => [document.document_id, removePagesFromDocument(document, localPageOwners)]));
    for (const document of qa?.localDocuments || []) byId.set(document.document_id, { ...(byId.get(document.document_id) || {}), ...document });
    return [...byId.values()].sort((a, b) => (a.page_start || 0) - (b.page_start || 0));
  }, [payload, qa]);
  const pageCount = payload?.sourceDocuments?.find((document) => document.source_document_id === "package")?.page_count || Math.max(...documents.map((document) => document.page_end || 1), 1);
  const activeDocument = documentForPage(documents, activePage) || documents.find((document) => document.document_id === activeId) || documents[0] || null;
  const agendaItems = useMemo(() => payload ? allItems(payload) : [], [payload]);
  const activeAgendaItem = agendaItems.find((item) => item.id === selectedAgendaId) || agendaItems.find((item) => item.id === primaryAgendaItemId(activeDocument)) || null;
  useEffect(() => { lucide.createIcons(); });
  useEffect(() => {
    fetchJson("/api/council-meetings/current").then((data) => {
      const hydrated = hydrateQa(data.packageDocuments || []);
      setPayload(data);
      setQa(hydrated);
      setActiveId(data.packageDocuments?.[0]?.document_id || "");
      setSelectedAgendaId(primaryAgendaItemId(data.packageDocuments?.[0]) || "");
      setActivePage(data.packageDocuments?.[0]?.page_start || 1);
      setStatus("ready");
    }).catch((error) => setStatus(error.message));
  }, []);
  useEffect(() => { if (qa) localStorage.setItem(STORE_KEY, JSON.stringify(qa)); }, [qa]);
  const toggleSelected = (page) => {
    if (!selectionMode) return;
    setSelectedPages((current) => current.includes(page) ? current.filter((candidate) => candidate !== page) : [...current, page].sort((a, b) => a - b));
  };
  const tagSelected = (tag) => setQa((current) => ({ ...current, pageTags: { ...current.pageTags, ...Object.fromEntries(selectedPages.map((page) => [pageKey(page), tag])) } }));
  const clearSelection = () => setSelectedPages([]);
  const scrollToPage = (page) => {
    setActivePage(page);
    const target = document.getElementById(`package-page-${page}`);
    const scroller = target?.closest(".pages");
    if (target && scroller) {
      scroller.scrollTo({ top: target.offsetTop - scroller.offsetTop, behavior: "smooth" });
    } else if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  };
  const selectDocument = (id) => {
    const target = documents.find((document) => document.document_id === id);
    if (!target) return;
    setActiveId(id);
    setSelectedAgendaId(primaryAgendaItemId(target) || "");
    scrollToPage(pageRange(target)[0] || target.page_start || 1);
    setSelectedPages([]);
  };
  const exportFeedback = () => {
    const feedback = { meeting_id: payload?.meeting?.meeting_id, source: payload?.tocSource, exported_at: new Date().toISOString(), qa };
    const blob = new Blob([JSON.stringify(feedback, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "document-import-feedback.json";
    link.click();
    URL.revokeObjectURL(url);
  };
  const selectAgendaItem = (id) => {
    setSelectedAgendaId(id);
    const linked = documentsForAgendaItem(documents, id);
    const agendaItem = agendaItems.find((item) => item.id === id);
    const targetPage = linked[0]?.page_start || agendaItem?.packagePage || agendaItem?.page || 1;
    if (linked[0]) setActiveId(linked[0].document_id);
    scrollToPage(targetPage);
    setSelectedPages([]);
  };
  if (status !== "ready" || !payload || !qa) return <div className="import-app"><Header /><main className="pages">{status}</main></div>;
  return <div className="import-app"><Header /><Toolbar meeting={payload.meeting} selectedPages={selectedPages} selectionMode={selectionMode} setSelectionMode={setSelectionMode} tagSelected={tagSelected} clearSelection={clearSelection} exportFeedback={exportFeedback} /><div className="import-shell"><LeftNavigation leftMode={leftMode} setLeftMode={setLeftMode} selectedAgendaId={selectedAgendaId} selectAgendaItem={selectAgendaItem} payload={payload} pageCount={pageCount} activePage={activePage} scrollToPage={scrollToPage} documents={documents} activeDocumentId={activeDocument?.document_id} selectDocument={selectDocument} categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter} qa={qa} /><PageListing documents={documents} pageCount={pageCount} categoryFilter={leftMode === "package" ? categoryFilter : ""} setActivePage={setActivePage} selectedPages={selectedPages} toggleSelected={toggleSelected} qa={qa} setQa={setQa} /><EditorPanel document={activeDocument} documents={documents} activePage={activePage} agendaItem={activeAgendaItem} selectedPages={selectedPages} setSelectedPages={setSelectedPages} qa={qa} setQa={setQa} setActiveId={setActiveId} scrollToPage={scrollToPage} agendaItems={agendaItems} payload={payload} /></div></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

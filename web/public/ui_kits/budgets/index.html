<!DOCTYPE html>
<html lang="en">
<head>

<title>Municipal budgets - Modern Democracy</title>

<style>
*{box-sizing:border-box}html,body,#root{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font-family:var(--font-ui)}a{color:var(--harbour-ink)}
header{background:var(--paper-2);border-bottom:1px solid var(--border-hair);padding:14px 22px}.head{align-items:center;display:flex;gap:20px;margin:auto;max-width:1420px}.brand{color:var(--ink);font-weight:800;text-decoration:none}.portal-nav,.budget-nav{display:flex;flex-wrap:wrap;gap:14px}.portal-nav{flex:1}.portal-nav a,.budget-nav a{font-size:13px;font-weight:700;text-decoration:none}.portal-nav a[aria-current],.budget-nav a[aria-current]{border-bottom:3px solid var(--municipal-accent);padding-bottom:5px}
main{margin:auto;max-width:1420px;padding:28px 22px 64px}.eyebrow{color:var(--fg-3);font:11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1.05;margin:7px 0 10px}h2{font-size:24px;margin:0 0 8px}h3{font-size:17px;margin:0 0 6px}.lede{color:var(--fg-2);line-height:1.5;max-width:900px}.budget-nav{border-bottom:1px solid var(--border-hair);margin:22px 0;padding-bottom:12px}
.controls{align-items:end;background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;display:flex;flex-wrap:wrap;gap:12px;margin:18px 0;padding:14px}.control{display:grid;gap:5px;min-width:260px}.control label{color:var(--fg-3);font:11px var(--font-mono);text-transform:uppercase}.control select,.control input{background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--ink);font:14px var(--font-ui);min-height:40px;padding:8px}.status{color:var(--fg-3);font:12px var(--font-mono);margin-left:auto}
.notice{background:var(--ochre-wash);border:1px solid var(--ochre);border-radius:5px;color:var(--ochre-ink);margin:14px 0;padding:12px}.notice.error{background:var(--brick-wash);border-color:var(--brick);color:var(--brick-ink)}.panel{background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;margin:16px 0;padding:18px}.panel-intro{color:var(--fg-3);font-size:13px;line-height:1.45;margin:0 0 14px}
.contents{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}.contents article,.project-card,.fact-card,.guide{background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;padding:16px}.contents article>a,.project-card>a{font-size:17px;font-weight:800;text-decoration:none}.contents ul{margin:12px 0 0;padding-left:18px}.contents li{margin:6px 0}.meta{color:var(--fg-3);font:11px var(--font-mono);margin-top:8px}.missing{color:var(--brick-ink)}
.fact-list,.project-grid,.guide-grid{display:grid;gap:12px}.fact-list{grid-template-columns:repeat(2,minmax(0,1fr))}.project-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.fact-card p,.guide p{color:var(--fg-2);line-height:1.55;margin:10px 0}.fact-content h4{font-family:var(--font-display);font-size:16px;line-height:1.25;margin:18px 0 7px}.fact-content h4:first-child{margin-top:12px}.fact-content ul,.fact-content ol{color:var(--fg-2);line-height:1.5;margin:9px 0;padding-left:28px}.fact-content li{margin:5px 0}.fact-card .source{font-size:12px}.badge{border:1px solid var(--border);border-radius:3px;display:inline-block;font:10px var(--font-mono);padding:3px 5px;text-transform:uppercase}
.table-wrap{overflow:auto}table{border-collapse:collapse;font-size:12px;margin-bottom:20px;width:100%}th,td{border-bottom:1px solid var(--border-hair);padding:8px 7px;text-align:left;vertical-align:top}th{color:var(--fg-3);font:10px var(--font-mono);letter-spacing:.03em;text-transform:uppercase}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.cell-evidence{display:block;font-size:10px;font-weight:400;margin-top:3px}.subtotal td{background:var(--paper-3);font-weight:800}.statement-title{background:var(--paper-3);font-size:14px;font-weight:800;padding:10px 8px}.empty{color:var(--fg-3);padding:20px;text-align:center}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.actions a{border:1px solid var(--border);border-radius:4px;font-size:12px;font-weight:700;padding:8px 10px;text-decoration:none}
@media(max-width:980px){.contents,.project-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.head{align-items:flex-start;flex-direction:column}.contents,.project-grid,.fact-list,.guide-grid{grid-template-columns:1fr}h1{font-size:34px}.status{margin-left:0}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const MUNICIPALITY="charlottetown";
const money=value=>value===null||value===undefined?"Unavailable":new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:0}).format(Number(value));
const number=value=>value===null||value===undefined?"Unavailable":Number(value).toLocaleString("en-CA");
const label=row=>row.display_label||row.raw_label;
const query=values=>{const p=new URLSearchParams();Object.entries(values).forEach(([key,value])=>{if(value!==null&&value!==undefined&&value!=="")p.set(key,value)});return p.toString()};
async function json(url){const response=await fetch(url);const body=await response.json();if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);return body}
async function allPages(path,values){let rows=[],cursor=0;do{const payload=await json(`${path}?${query({...values,limit:1000,cursor})}`);rows.push(...payload.data);cursor=payload.pagination?.next_cursor}while(cursor!==null&&cursor!==undefined);return rows}
function routeState(){const parts=location.pathname.replace(/^\/+|\/+$/g,"").split("/");if(parts[0]!=="budgets")return{mode:"home"};if(parts[1]==="departments"&&parts[2])return{mode:"department",key:decodeURIComponent(parts[2]),section:`operating.${decodeURIComponent(parts[2])}`};if(parts[1]==="projects"&&parts[2])return{mode:"project",key:decodeURIComponent(parts[2])};return{mode:parts[1]||"home",section:{overview:"budget-overview",operating:"operating-budget",capital:"capital-budget",appendices:"appendices"}[parts[1]]||null}}
const ROUTE=routeState();
function Header(){return <header><div className="head"><a className="brand" href="/">Modern Democracy</a><nav className="portal-nav"><a href="/">Portal</a><a href="/budgets" aria-current="page">Budgets</a><a href="/planning">Planning</a><a href="/meetings">Meetings</a></nav></div></header>}
function BudgetNav(){const current=ROUTE.mode;return <nav className="budget-nav" aria-label="Budget views"><a href="/budgets" aria-current={current==="home"?"page":undefined}>Contents</a><a href="/budgets/overview" aria-current={current==="overview"?"page":undefined}>Overview</a><a href="/budgets/operating" aria-current={["operating","department"].includes(current)?"page":undefined}>Operating</a><a href="/budgets/capital" aria-current={["capital","project"].includes(current)?"page":undefined}>Capital</a><a href="/budgets/appendices" aria-current={current==="appendices"?"page":undefined}>Appendices</a><a href="/budgets/facts" aria-current={current==="facts"?"page":undefined}>Contextual facts</a><a href="/budgets/observations" aria-current={current==="observations"?"page":undefined}>Financial observations</a></nav>}
function titleFor(){return{home:"Budget contents",overview:"Budget overview",operating:"Operating budget",department:"Department budget",capital:"Capital budget",project:"Capital project",appendices:"Budget appendices",facts:"Contextual facts",observations:"Financial observations"}[ROUTE.mode]||"Municipal budget"}
function pageHref(section){if(section.section_key==="budget-overview")return"/budgets/overview";if(section.section_key==="operating-budget")return"/budgets/operating";if(section.section_key==="capital-budget")return"/budgets/capital";if(section.section_key==="appendices")return"/budgets/appendices";if(section.canonical_role==="department")return`/budgets/departments/${encodeURIComponent(section.section_key.replace("operating.",""))}`;return null}
function App(){
 const [editions,setEditions]=useState([]),[documentId,setDocumentId]=useState(""),[structure,setStructure]=useState([]),[facts,setFacts]=useState([]),[observations,setObservations]=useState([]),[projects,setProjects]=useState([]),[project,setProject]=useState(null),[status,setStatus]=useState("Loading budget editions."),[error,setError]=useState("");
 const edition=editions.find(item=>String(item.document_id)===String(documentId));
 useEffect(()=>{json(`/api/budgets/editions?municipality=${MUNICIPALITY}&limit=100`).then(payload=>{setEditions(payload.data);setDocumentId(String(payload.data[0]?.document_id||""))}).catch(e=>setError(e.message))},[]);
 useEffect(()=>{if(!documentId)return;let active=true;setStatus("Loading the selected budget structure.");setError("");(async()=>{try{
   const base={municipality:MUNICIPALITY,document:documentId};
   const section=ROUTE.section;
   const [structurePayload,loadedFacts,loadedObservations,loadedProjects,loadedProject]=await Promise.all([
     json(`/api/budgets/structure?${query(base)}`),
     ROUTE.mode==="home"?Promise.resolve([]):allPages("/api/budgets/facts",{...base,...(section?{section}:{})}),
     ["overview","operating","department","capital","appendices","observations"].includes(ROUTE.mode)?allPages("/api/budgets/observations",{...base,...(section?{section}:{})}):Promise.resolve([]),
     ["capital","department"].includes(ROUTE.mode)?allPages("/api/projects",{...base,...(ROUTE.mode==="department"?{department:ROUTE.key}:{})}):Promise.resolve([]),
     ROUTE.mode==="project"?json(`/api/projects/${encodeURIComponent(ROUTE.key)}?municipality=${MUNICIPALITY}`).then(p=>p.data):Promise.resolve(null),
   ]);
   if(!active)return;setStructure(structurePayload.data);setFacts(loadedFacts);setObservations(loadedObservations);setProjects(loadedProjects);setProject(loadedProject);setStatus(ROUTE.mode==="home"?`${edition?.edition_label||"Budget"}: ${edition?.document_observation_count||0} published financial observations.`:`${edition?.edition_label||"Budget"}: ${loadedFacts.length} contextual facts and ${loadedObservations.length} financial observations loaded.`)
  }catch(e){if(active){setError(e.message);setStatus("Load failed.")}}})();return()=>{active=false}},[documentId,edition?.edition_label]);
 const roots=structure.filter(row=>!row.parent_id&&!["front_matter","back_matter"].includes(row.canonical_role));
 const selected=structure.find(row=>row.section_key===ROUTE.section);
 return <><Header/><main><p className="eyebrow">Charlottetown municipal budgets</p><h1>{ROUTE.mode==="department"?(selected?.title||titleFor()):ROUTE.mode==="project"?(project?.name||titleFor()):titleFor()}</h1><p className="lede">The annual budget is organized using the 2026/2027 document pattern. Contextual facts retain source wording and citations. Financial observations contain reported numeric or textual values.</p><BudgetNav/>
 <div className="controls"><div className="control"><label htmlFor="edition">Budget edition</label><select id="edition" value={documentId} onChange={e=>setDocumentId(e.target.value)}>{editions.map(item=><option key={item.document_id} value={item.document_id}>{item.edition_label} - {item.title}</option>)}</select></div><div className="status" role="status" aria-live="polite">{status}</div></div>
 {error&&<div className="notice error" role="alert">{error}</div>}
 {ROUTE.mode==="home"&&<Contents roots={roots} structure={structure}/>}
 {ROUTE.mode==="overview"&&<Overview selected={selected} facts={facts}/>}
 {ROUTE.mode==="operating"&&<Operating structure={structure} observations={observations}/>}
 {ROUTE.mode==="department"&&<Department facts={facts} observations={observations} projects={projects}/>}
 {ROUTE.mode==="capital"&&<Capital facts={facts} observations={observations} projects={projects}/>}
 {ROUTE.mode==="project"&&<Project project={project}/>}
 {ROUTE.mode==="appendices"&&<Appendices structure={structure} facts={facts} observations={observations}/>}
 {ROUTE.mode==="facts"&&<FactCards facts={facts}/>}
 {ROUTE.mode==="observations"&&<ObservationTable rows={observations}/>}
 </main></>
}
function Contents({roots,structure}){return <section><p className="panel-intro">Select a high-level section or a department. Repeated totals remain visible within their source section.</p><div className="contents">{roots.map(root=>{const children=structure.filter(row=>row.parent_id===root.id);const href=pageHref(root);return <article key={root.id}><a href={href||"#"}>{root.title}</a><div className="meta">Source pages {root.start_page||"not present"}{root.end_page&&root.end_page!==root.start_page?`-${root.end_page}`:""}</div>{children.length>0&&<ul>{children.map(child=><li key={child.id}>{pageHref(child)?<a href={pageHref(child)}>{child.title}</a>:child.title}{child.start_page===null&&<span className="missing"> - not present</span>}</li>)}</ul>}</article>})}</div></section>}
function Overview({selected,facts}){const guides=selected?.guides||[];return <><section className="panel"><h2>Municipal budgeting guide</h2><p className="panel-intro">Standardized editorial explanations. These are not source facts.</p><div className="guide-grid">{guides.map(guide=><article className="guide" key={guide.key}><h3>{guide.title}</h3><p>{guide.body}</p></article>)}</div></section><section className="panel"><h2>From this budget edition</h2><FactCards facts={facts}/></section></>}
function Operating({structure,observations}){const departments=structure.filter(row=>row.canonical_role==="department"&&row.parent_id===structure.find(root=>root.section_key==="operating-budget")?.id);const overview=observations.filter(row=>row.section_key==="operating-budget");return <><section className="panel"><h2>Operating overview</h2><p className="panel-intro">City-wide operating statements reported before the department sections.</p><ObservationTable rows={overview}/></section><section className="panel"><h2>Departments</h2><p className="panel-intro">Each department page combines source summaries, services, highlights, operating values, and source-supported capital-project links.</p><div className="contents">{departments.map(item=><article key={item.id}><a href={pageHref(item)}>{item.title}</a><div className="meta">Pages {item.start_page}-{item.end_page} · {item.fact_count} contextual facts</div></article>)}</div></section></>}
function Department({facts,observations,projects}){return <><section className="panel"><h2>Department context</h2><FactCards facts={facts}/></section><section className="panel"><h2>Operating budget</h2><ObservationTable rows={observations}/></section><section className="panel"><h2>Associated capital projects</h2><ProjectCards projects={projects}/></section></>}
function Capital({facts,observations,projects}){const overview=observations.filter(row=>row.section_key==="capital-budget"||row.statement_key==="capital-page-111-capital");const schedules=observations.filter(row=>!overview.includes(row));return <><section className="panel"><h2>Capital overview</h2><p className="panel-intro">City and utility capital summaries reported before the project profiles.</p><ObservationTable rows={overview}/></section><section className="panel"><h2>Capital programs and projects</h2><p className="panel-intro">Projects appear only in the capital budget. Gross amounts, partner funding, financing, and net municipal amounts remain distinct.</p><ProjectCards projects={projects}/></section><section className="panel"><h2>Capital program schedules</h2><ObservationTable rows={schedules}/></section></>}
function Project({project}){if(!project)return <p className="empty">Loading project.</p>;return <><section className="panel"><h2>Project context</h2><p className="panel-intro">{project.department_name||"Department unavailable"} Â· {project.reporting_entity} Â· {project.status}</p><FactCards facts={project.facts||[]}/></section><section className="panel"><h2>Budget observations</h2><ObservationTable rows={project.observations||[]}/></section></>}
function Appendices({structure,facts,observations}){const root=structure.find(row=>row.section_key==="appendices");const children=structure.filter(row=>row.parent_id===root?.id);return <>{children.map(child=><section className="panel" key={child.id}><h2>{child.title}</h2>{child.start_page===null?<p className="missing">This appendix is not present in the selected edition.</p>:<><div className="meta">Source pages {child.start_page}-{child.end_page}</div><FactCards facts={facts.filter(row=>row.section_key===child.section_key)}/><ObservationTable rows={observations.filter(row=>row.section_key===child.section_key)}/></>}</section>)}</>}
function FactContent({fact}){const blocks=fact.content_json?.blocks;if(!Array.isArray(blocks)||!blocks.length)return <p>{fact.body_text}</p>;return <div className="fact-content">{blocks.map((block,index)=>{if(block.type==="heading")return <h4 key={index}>{block.text}</h4>;if(block.type==="unordered_list")return <ul key={index}>{(block.items||[]).map((item,itemIndex)=><li key={itemIndex}>{item}</li>)}</ul>;if(block.type==="ordered_list")return <ol key={index}>{(block.items||[]).map((item,itemIndex)=><li key={itemIndex}>{item}</li>)}</ol>;return <p key={index}>{block.text}</p>})}</div>}
function FactCards({facts}){if(!facts.length)return <p className="empty">No contextual facts are available for this section.</p>;return <div className="fact-list">{facts.map(row=><article className="fact-card" key={`${row.edition_document_id}-${row.fact_id}`}><span className="badge">{row.fact_kind}</span><h3>{row.title}</h3><FactContent fact={row}/><div className="source">{row.source_pages?.[0]?<a href={`/api/budgets/sources/${row.source_document_id}/pages/${row.source_pages[0]}?municipality=${MUNICIPALITY}`} target="_blank" rel="noreferrer">Source page {row.source_pages[0]}</a>:"Source page unavailable"} · <a href={`/api/budgets/facts/${row.fact_id}?municipality=${MUNICIPALITY}`}>Fact {row.fact_id}</a></div></article>)}</div>}
function ProjectCards({projects}){if(!projects.length)return <p className="empty">No source-supported capital projects are associated with this view.</p>;return <div className="project-grid">{projects.map(project=><article className="project-card" key={project.project_key}><a href={`/budgets/projects/${encodeURIComponent(project.project_key)}`}>{project.name}</a><div className="meta">{project.department_name||"Department unavailable"} Â· {project.status}</div><p>Gross {money(project.gross_amount)} Â· Net {money(project.net_amount)}</p></article>)}</div>}
function titleCase(value){return String(value||"").replaceAll("_"," ").replace(/\b\w/g,character=>character.toUpperCase())}
function periodHeading(value){const match=String(value||"").match(/^(\d{4})-(\d{4})-(budget|forecast|actual)$/);return match?`${match[1]}/${match[2]} ${titleCase(match[3])}`:value}
function columnHeading(rows){const raw=rows.find(row=>row.raw_column_label)?.raw_column_label||"";if(!/^\d{4}-\d{4}-(budget|forecast|actual)$/.test(raw)&&raw)return raw;const counts=new Map();rows.forEach(row=>counts.set(row.amount_type,(counts.get(row.amount_type)||0)+1));const common=[...counts.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0];if(rows[0]?.statement_kind==="debt"||rows[0]?.statement_kind==="debt_schedule")return titleCase(common);if(rows[0]?.statement_kind==="tax_assessment_rate"&&common!=="budget")return titleCase(common);return periodHeading(rows[0]?.fiscal_period_label||raw)}
function observationColumnKey(observation){return ["tax_assessment_rate","debt","debt_schedule"].includes(observation.statement_kind)?`order:${observation.column_order??0}`:`period:${observation.fiscal_period_label}`}
function observationColumnSort(left,right){return String(left).localeCompare(String(right),"en",{numeric:true})}
function ObservationTable({rows}){const visible=rows.filter(row=>row.aggregation_role!=="non_additive");if(!visible.length)return <p className="empty">No reader-facing financial observations are available for this section.</p>;const statements=new Map();visible.forEach(observation=>{if(!statements.has(observation.statement_id))statements.set(observation.statement_id,{title:observation.statement_title,rows:[]});statements.get(observation.statement_id).rows.push(observation)});return <div className="table-wrap">{[...statements.entries()].map(([statementId,statement])=>{const columns=new Map();const lines=new Map();statement.rows.forEach(observation=>{const column=observationColumnKey(observation);if(!columns.has(column))columns.set(column,[]);columns.get(column).push(observation);const displayRowKey=observation.source_row_id||observation.line_item_id;if(!lines.has(displayRowKey))lines.set(displayRowKey,{label:label(observation),role:observation.aggregation_role,rowOrder:Number(observation.row_order),cells:new Map()});lines.get(displayRowKey).cells.set(column,observation)});const orderedColumns=[...columns.entries()].sort((a,b)=>observationColumnSort(a[0],b[0]));const orderedLines=[...lines.values()].sort((a,b)=>a.rowOrder-b.rowOrder);return <table key={statementId}><caption className="statement-title">{statement.title}</caption><thead><tr><th>Line item</th>{orderedColumns.map(([column,columnRows])=><th className="num" key={column}>{columnHeading(columnRows)}</th>)}</tr></thead><tbody>{orderedLines.map((line,index)=><tr key={index} className={["total","subtotal"].includes(line.role)?"subtotal":""}><td>{line.label}</td>{orderedColumns.map(([column])=>{const observation=line.cells.get(column);return <td className="num" key={column}>{observation?<>{observation.value_numeric===null?observation.value_text:(observation.measure_unit==="cad"?money(observation.value_numeric):number(observation.value_numeric))}<a className="cell-evidence" href={`/api/budgets/observations/${observation.observation_id}?municipality=${MUNICIPALITY}`}>Observation {observation.observation_id}</a></>:"—"}</td>})}</tr>)}</tbody></table>})}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Municipal budgets - Modern Democracy</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../themes/charlottetown.css">
<style>
html,body,#root{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font-family:var(--font-ui)}*{box-sizing:border-box}
a{color:var(--harbour-ink)}header{background:var(--paper-2);border-bottom:1px solid var(--border-hair);padding:14px 22px}.head{align-items:center;display:flex;gap:18px;margin:auto;max-width:1400px}.brand{color:var(--ink);font-weight:800;text-decoration:none}.nav{display:flex;flex:1;gap:12px}.nav a{font-size:13px;font-weight:700;text-decoration:none}.nav a[aria-current]{border-bottom:3px solid var(--municipal-accent);padding-bottom:5px}
main{margin:auto;max-width:1400px;padding:28px 22px 60px}.eyebrow{color:var(--fg-3);font:11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1;margin:7px 0 10px}.lede{color:var(--fg-2);line-height:1.5;max-width:850px}.controls{align-items:end;background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;display:flex;flex-wrap:wrap;gap:14px;margin:22px 0;padding:14px}.control{display:grid;gap:5px}.control label{color:var(--fg-3);font:11px var(--font-mono);text-transform:uppercase}.control select,.control input{background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--ink);font:14px var(--font-ui);min-height:38px;padding:7px 9px}.status{margin-left:auto;color:var(--fg-3);font:12px var(--font-mono)}
.notice{background:var(--ochre-wash);border:1px solid var(--ochre);border-radius:5px;color:var(--ochre-ink);margin:14px 0;padding:12px}.error{background:var(--brick-wash);border-color:var(--brick);color:var(--brick-ink)}.cards{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.card,.panel{background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;padding:16px}.card .label{color:var(--fg-3);font:11px var(--font-mono);text-transform:uppercase}.card strong{display:block;font-size:24px;margin-top:8px}.card small{color:var(--fg-3)}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(350px,.8fr)}.panel{margin-bottom:16px}.panel h2{font-size:20px;margin:0 0 5px}.panel-intro{color:var(--fg-3);font-size:13px;margin:0 0 15px}.bars{display:grid;gap:10px}.bar-row{display:grid;gap:8px;grid-template-columns:minmax(150px,1fr) 3fr 110px;align-items:center;font-size:13px}.track{background:var(--paper-3);height:18px}.fill{background:var(--municipal-accent);height:100%;min-width:2px}.fill.capital{background:var(--ochre)}.amount{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow:auto}table{border-collapse:collapse;font-size:13px;width:100%}th,td{border-bottom:1px solid var(--border-hair);padding:9px 7px;text-align:left;vertical-align:top}th{color:var(--fg-3);font:11px var(--font-mono);text-transform:uppercase}td.num{text-align:right;font-variant-numeric:tabular-nums}.project-link{background:none;border:0;color:var(--harbour-ink);cursor:pointer;font:700 13px var(--font-ui);padding:0;text-align:left}.badge{border:1px solid var(--border);border-radius:3px;display:inline-block;font:10px var(--font-mono);padding:3px 5px;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.actions a{background:var(--paper-2);border:1px solid var(--border);border-radius:4px;font-size:13px;font-weight:700;padding:9px 11px;text-decoration:none}.detail dl{display:grid;grid-template-columns:120px 1fr;gap:7px;margin:12px 0;font-size:13px}.detail dt{color:var(--fg-3);font-family:var(--font-mono)}.detail dd{margin:0}.empty{color:var(--fg-3);padding:20px;text-align:center}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.status{margin-left:0}.bar-row{grid-template-columns:1fr}.amount{text-align:left}}@media(max-width:520px){.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}h1{font-size:34px}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const MUNICIPALITY="charlottetown";
const money=(value)=>value===null||value===undefined?"Not reported":new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:0}).format(Number(value));
const isCurrency=(unit)=>unit==="cad"||unit==="currency";
const dateLabel=(value)=>value?String(value).slice(0,10):"Date unavailable";
async function json(url){const response=await fetch(url);const body=await response.json();if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);return body}
function total(rows,kind){return rows.filter(row=>row.statement_kind===kind&&isCurrency(row.measure_unit)).reduce((sum,row)=>sum+Number(row.value_numeric||0),0)}
function App(){
 const [periods,setPeriods]=useState([]),[period,setPeriod]=useState(""),[summary,setSummary]=useState([]),[projects,setProjects]=useState([]),[query,setQuery]=useState(""),[selected,setSelected]=useState(null),[status,setStatus]=useState("Loading published budget data."),[error,setError]=useState("");
 useEffect(()=>{json(`/api/budgets/periods?municipality=${MUNICIPALITY}&limit=1000`).then(payload=>{const unique=[...new Map(payload.data.map(p=>[p.label,p])).values()];setPeriods(unique);setPeriod(unique.at(-1)?.label||"")}).catch(e=>setError(e.message))},[]);
 useEffect(()=>{if(!period)return;setStatus("Loading selected fiscal period.");setError("");Promise.all([
  json(`/api/budgets/summary?municipality=${MUNICIPALITY}&period=${encodeURIComponent(period)}&limit=1000`),
  json(`/api/projects?municipality=${MUNICIPALITY}&period=${encodeURIComponent(period)}&limit=1000`)
 ]).then(([s,p])=>{setSummary(s.data);setProjects(p.data);setSelected(null);setStatus(`${p.data.length} published capital projects in this period.`)}).catch(e=>{setError(e.message);setStatus("Load failed.")})},[period]);
 const filtered=useMemo(()=>projects.filter(p=>`${p.name} ${p.reporting_entity}`.toLowerCase().includes(query.toLowerCase())),[projects,query]);
 const bars=useMemo(()=>summary.filter(r=>isCurrency(r.measure_unit)&&Number(r.value_numeric)!==0).sort((a,b)=>Math.abs(Number(b.value_numeric))-Math.abs(Number(a.value_numeric))).slice(0,10),[summary]);
 const max=Math.max(1,...bars.map(r=>Math.abs(Number(r.value_numeric))));
 const metrics=[
  ["Operating detail",summary.filter(r=>String(r.statement_kind).startsWith("operating")).reduce((s,r)=>s+Number(r.value_numeric||0),0)],
  ["Capital detail",total(summary,"capital_budget_schedule")+total(summary,"capital")],
  ["Debt schedules",summary.filter(r=>String(r.statement_kind).includes("debt")).reduce((s,r)=>s+Number(r.value_numeric||0),0)],
  ["Published projects",projects.length]
 ];
 async function openProject(key){setStatus("Loading project detail.");try{const payload=await json(`/api/projects/${encodeURIComponent(key)}?municipality=${MUNICIPALITY}`);setSelected(payload.data);setStatus(`Loaded ${payload.data.name}.`)}catch(e){setError(e.message)}}
 return <><header><div className="head"><a className="brand" href="/">Modern Democracy</a><nav className="nav" aria-label="Portal"><a href="/">Portal</a><a href="/budgets" aria-current="page">Budgets</a><a href="/planning">Planning</a><a href="/meetings">Meetings</a></nav></div></header><main>
  <p className="eyebrow">Charlottetown public data</p><h1>Municipal budgets</h1><p className="lede">Explore the published three-year budget snapshot, reported financial facts, and capital projects. Values retain municipal fiscal-period labels and source provenance.</p>
  <div className="controls"><div className="control"><label htmlFor="period">Fiscal period</label><select id="period" value={period} onChange={e=>setPeriod(e.target.value)}>{periods.map(p=><option key={p.label} value={p.label}>{p.label} ({dateLabel(p.start_date)} to {dateLabel(p.end_date)})</option>)}</select></div><div className="control"><label htmlFor="search">Filter projects</label><input id="search" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Project or entity" /></div><div className="status" role="status" aria-live="polite">{status}</div></div>
  {error&&<div className="notice error" role="alert">{error}</div>}
  <div className="notice">Totals below sum published non-duplicated detail facts. They are exploratory, not audited financial-statement totals. Negative funding deductions remain separate from positive spending.</div>
  <section className="cards" aria-label="Budget summary">{metrics.map(([label,value],i)=><article className="card" key={label}><span className="label">{label}</span><strong>{i===3?Number(value).toLocaleString("en-CA"):money(value)}</strong><small>{period||"No period selected"}</small></article>)}</section>
  <div className="actions"><a href={`/api/budgets/download.csv?municipality=${MUNICIPALITY}&period=${encodeURIComponent(period)}&limit=1000`}>Download published facts CSV</a><a href={`/api/budgets/sources?municipality=${MUNICIPALITY}&period=${encodeURIComponent(period)}`}>View source inventory JSON</a></div>
  <div className="layout"><div>
   <section className="panel"><h2>Published financial detail</h2><p className="panel-intro">Sorted absolute values by statement family and amount type. The table is the canonical representation.</p>{bars.length?<><div className="bars" role="img" aria-label="Bar chart of published financial detail">{bars.map((r,i)=><div className="bar-row" key={`${r.statement_kind}-${r.amount_type}-${i}`}><span>{r.statement_kind.replaceAll("_"," ")} · {r.amount_type}</span><div className="track"><div className={`fill ${r.statement_kind.includes("capital")?"capital":""}`} style={{width:`${Math.abs(Number(r.value_numeric))/max*100}%`}}></div></div><span className="amount">{money(r.value_numeric)}</span></div>)}</div><div className="table-wrap"><table><thead><tr><th>Statement</th><th>Amount type</th><th>Unit</th><th>Facts</th><th>Value</th></tr></thead><tbody>{bars.map((r,i)=><tr key={i}><td>{r.statement_kind}</td><td>{r.amount_type}</td><td>{r.measure_unit}</td><td className="num">{r.input_fact_count}</td><td className="num">{money(r.value_numeric)}</td></tr>)}</tbody></table></div></>:<p className="empty">No published financial detail for this period.</p>}</section>
   <section className="panel"><h2>Capital projects</h2><p className="panel-intro">Only projects linked to facts in the published snapshot are shown. Select a project for evidence and multi-year facts.</p><div className="table-wrap"><table><thead><tr><th>Project</th><th>Entity</th><th>Status</th><th>Periods</th><th>Gross</th><th>Funding</th><th>Net</th></tr></thead><tbody>{filtered.map(p=><tr key={p.project_key}><td><button className="project-link" onClick={()=>openProject(p.project_key)}>{p.name}</button></td><td>{p.reporting_entity}</td><td><span className="badge">{p.status}</span></td><td>{p.periods.join(", ")}</td><td className="num">{money(p.gross_amount)}</td><td className="num">{money(p.external_funding)}</td><td className="num">{money(p.net_amount)}</td></tr>)}</tbody></table>{!filtered.length&&<p className="empty">No matching published projects.</p>}</div></section>
  </div><aside><section className="panel detail"><h2>Project detail</h2>{selected?<><h3>{selected.name}</h3><dl><dt>Status</dt><dd>{selected.status}</dd><dt>Entity</dt><dd>{selected.reporting_entity}</dd><dt>Location</dt><dd>{selected.location_text||"Not reported"}</dd><dt>Description</dt><dd>{selected.description||"Not reported"}</dd></dl><h3>Published facts</h3><div className="table-wrap"><table><thead><tr><th>Period</th><th>Label</th><th>Type</th><th>Value</th></tr></thead><tbody>{selected.facts.map(f=><tr key={f.fact_id}><td>{f.fiscal_period_label}</td><td><a href={`/api/budgets/facts/${f.fact_id}?municipality=${MUNICIPALITY}`}>{f.display_label||f.raw_label}</a></td><td>{f.amount_type}</td><td className="num">{isCurrency(f.measure_unit)?money(f.value_numeric):f.value_numeric||f.value_text}</td></tr>)}</tbody></table></div><h3>Source references</h3>{selected.references.length?<ul>{selected.references.map((r,i)=><li key={i}>{r.raw_label} · {r.document_title} · {r.identity_evidence}</li>)}</ul>:<p>No separate approved project references.</p>}</>:<p className="empty">Select a published capital project.</p>}</section></aside></div>
  <section className="panel"><h2>Coverage and limitations</h2><ul><li>Snapshot: <code>charlottetown-budget-2024-2027-initial</code>, taxonomy <code>charlottetown-budget-v1</code>.</li><li>Fiscal periods are displayed as reported and are not relabeled as calendar years.</li><li>Project status is <code>unknown</code> where no source-supported lifecycle conclusion is stored.</li><li>Cross-municipality, per-capita, and inflation-adjusted comparisons are unavailable.</li></ul></section>
 </main></>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>

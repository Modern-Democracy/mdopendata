<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Municipal budgets - Modern Democracy</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../themes/charlottetown.css">
<style>
html,body,#root{min-height:100%;margin:0}*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);font-family:var(--font-ui)}a{color:var(--harbour-ink)}
header{background:var(--paper-2);border-bottom:1px solid var(--border-hair);padding:14px 22px}.head{align-items:center;display:flex;gap:18px;margin:auto;max-width:1500px}.brand{color:var(--ink);font-weight:800;text-decoration:none}.nav{display:flex;flex:1;gap:14px}.nav a{font-size:13px;font-weight:700;text-decoration:none}.nav a[aria-current]{border-bottom:3px solid var(--municipal-accent);padding-bottom:5px}
main{margin:auto;max-width:1500px;padding:28px 22px 60px}.eyebrow{color:var(--fg-3);font:11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1;margin:7px 0 10px}.lede{color:var(--fg-2);line-height:1.5;max-width:980px}.subnav{display:flex;gap:8px;margin:20px 0}.subnav a{border:1px solid var(--border);border-radius:4px;font-size:13px;font-weight:700;padding:9px 12px;text-decoration:none}.subnav a[aria-current]{background:var(--ink);color:var(--paper)}
.controls{align-items:end;background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;display:flex;flex-wrap:wrap;gap:12px;margin:18px 0;padding:14px}.control{display:grid;gap:5px;min-width:180px}.control label{color:var(--fg-3);font:11px var(--font-mono);text-transform:uppercase}.control select,.control input{background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--ink);font:14px var(--font-ui);min-height:38px;padding:7px 9px}.control.grow{flex:1}.button{background:var(--ink);border:1px solid var(--ink);border-radius:4px;color:var(--paper);cursor:pointer;font-weight:700;min-height:38px;padding:8px 12px}.status{color:var(--fg-3);font:12px var(--font-mono);margin-left:auto}
.notice{background:var(--ochre-wash);border:1px solid var(--ochre);border-radius:5px;color:var(--ochre-ink);margin:14px 0;padding:12px}.notice.error{background:var(--brick-wash);border-color:var(--brick);color:var(--brick-ink)}.panel{background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;margin:16px 0;padding:16px}.panel h2{font-size:21px;margin:0 0 5px}.panel h3{font-size:16px;margin:20px 0 8px}.panel-intro{color:var(--fg-3);font-size:13px;line-height:1.45;margin:0 0 14px}.cards{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0}.card{background:var(--paper-2);border:1px solid var(--border-hair);border-radius:6px;padding:15px}.card span{color:var(--fg-3);font:11px var(--font-mono);text-transform:uppercase}.card strong{display:block;font-size:24px;margin-top:8px}.card small{color:var(--fg-3)}
.pair{display:grid;gap:16px;grid-template-columns:1fr 1fr}.table-wrap{overflow:auto}table{border-collapse:collapse;font-size:12px;width:100%}th,td{border-bottom:1px solid var(--border-hair);padding:8px 7px;text-align:left;vertical-align:top}th{color:var(--fg-3);font:10px var(--font-mono);letter-spacing:.03em;text-transform:uppercase}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.subtotal td{background:var(--paper-3);font-weight:800}.group{color:var(--fg-2);font-size:11px}.badge{border:1px solid var(--border);border-radius:3px;display:inline-block;font:10px var(--font-mono);padding:3px 5px;text-transform:uppercase}.badge.proposed{border-color:var(--ochre);color:var(--ochre-ink)}.badge.approved{border-color:var(--sea);color:var(--sea-ink)}.empty{color:var(--fg-3);padding:20px;text-align:center}.net{align-items:center;background:var(--paper-3);display:flex;justify-content:space-between;margin-top:12px;padding:12px}.net strong{font-size:20px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.actions a{border:1px solid var(--border);border-radius:4px;font-size:12px;font-weight:700;padding:8px 10px;text-decoration:none}.facts-grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}.definition{border-left:4px solid var(--municipal-accent);padding-left:12px}.definition h3{margin:0 0 5px}.definition p{color:var(--fg-2);font-size:13px;line-height:1.45;margin:0}.pagination{display:flex;justify-content:center;margin:15px}
@media(max-width:1000px){.pair{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.facts-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.cards,.facts-grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.nav,.subnav{flex-wrap:wrap}h1{font-size:34px}.status{margin-left:0}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const MUNICIPALITY="charlottetown";
const FACT_MODE=location.pathname.replace(/\/$/,"")==="/budgets/facts";
const money=(value)=>value===null||value===undefined?"Unavailable":new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD",maximumFractionDigits:0}).format(Number(value));
const number=(value)=>value===null||value===undefined?"Unavailable":Number(value).toLocaleString("en-CA");
const label=(fact)=>fact.display_label||fact.raw_label;
async function json(url){const response=await fetch(url);const body=await response.json();if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);return body}
function params(values){const p=new URLSearchParams();Object.entries(values).forEach(([key,value])=>{if(value!==""&&value!==null&&value!==undefined)p.set(key,value)});return p.toString()}
function Select({name,value,onChange,options,all="All"}){return <div className="control"><label htmlFor={name}>{name.replaceAll("_"," ")}</label><select id={name} value={value} onChange={e=>onChange(e.target.value)}><option value="">{all}</option>{options.map(item=><option key={item.key??item.value} value={item.key??item.value}>{item.name??item.value}</option>)}</select></div>}
function Header(){return <><header><div className="head"><a className="brand" href="/">Modern Democracy</a><nav className="nav" aria-label="Portal"><a href="/">Portal</a><a href="/budgets" aria-current="page">Budgets</a><a href="/planning">Planning</a><a href="/meetings">Meetings</a></nav></div></header></>}
function Subnav(){return <nav className="subnav" aria-label="Budget views"><a href="/budgets" aria-current={!FACT_MODE?"page":undefined}>Budget year</a><a href="/budgets/facts" aria-current={FACT_MODE?"page":undefined}>Fact explorer</a></nav>}
function FactTable({title,rows,showFollowup=true}){
 const total=rows.filter(row=>row.aggregation_role==="detail"&&row.measure_unit==="cad").reduce((sum,row)=>sum+Number(row.value_numeric||0),0);
 return <section><h3>{title}</h3><div className="table-wrap"><table><thead><tr><th>Department, facility, or source section</th><th>Line</th><th>Role</th><th>Category</th><th className="num">Budget</th>{showFollowup&&<th className="num">Subsequent forecast</th>}<th>Evidence</th></tr></thead><tbody>{rows.map(row=><tr key={row.fact_id} className={row.aggregation_role==="total"||row.aggregation_role==="subtotal"?"subtotal":""}><td className="group">{row.effective_organization_unit_name||row.reporting_entity_name}<br/>{row.statement_title}</td><td>{label(row)}</td><td>{row.aggregation_role}</td><td>{row.category_candidate_key?<><span className={`badge ${row.category_assignment_status}`}>{row.category_assignment_status}</span><br/>{row.category_candidate_key}</>:"Unassigned"}</td><td className="num">{row.measure_unit==="cad"?money(row.value_numeric):number(row.value_numeric)}</td>{showFollowup&&<td className="num">{row.followup_fact_id?money(row.followup_value_numeric):"Unavailable"}</td>}<td><a href={`/api/budgets/facts/${row.fact_id}?municipality=${MUNICIPALITY}`}>Fact {row.fact_id}</a></td></tr>)}</tbody><tfoot><tr className="subtotal"><td colSpan="4">Detail subtotal</td><td className="num">{money(total)}</td>{showFollowup&&<td/>}<td/></tr></tfoot></table></div>{!rows.length&&<p className="empty">No classified facts in this section.</p>}</section>
}
function CompactTable({rows,columns}){return <div className="table-wrap"><table><thead><tr>{columns.map(col=><th key={col.key} className={col.num?"num":""}>{col.label}</th>)}</tr></thead><tbody>{rows.map((row,i)=><tr key={row.fact_id||row.project_key||i}>{columns.map(col=><td key={col.key} className={col.num?"num":""}>{col.render?col.render(row):row[col.key]??"Unavailable"}</td>)}</tr>)}</tbody></table>{!rows.length&&<p className="empty">No facts available.</p>}</div>}
function initialFactFilters(){const q=new URLSearchParams(location.search);const values={department:"",program:"",project:"",category:"",category_status:"",statement_kind:"",amount_type:"",aggregation_role:"",q:""};Object.keys(values).forEach(key=>{if(q.has(key))values[key]=q.get(key)});return values}
function App(){
 const [editions,setEditions]=useState([]),[documentId,setDocumentId]=useState(""),[dimensions,setDimensions]=useState({departments:[],programs:[],projects:[],categories:[],statement_kinds:[],amount_types:[]});
 const [facts,setFacts]=useState([]),[projects,setProjects]=useState([]),[nextCursor,setNextCursor]=useState(null),[status,setStatus]=useState("Loading budget editions."),[error,setError]=useState("");
 const [filters,setFilters]=useState(initialFactFilters);
 const loadSequence=React.useRef(0);
 const edition=editions.find(item=>String(item.document_id)===String(documentId));
 useEffect(()=>{json(`/api/budgets/editions?municipality=${MUNICIPALITY}&limit=100`).then(payload=>{setEditions(payload.data);setDocumentId(String(payload.data[0]?.document_id||""))}).catch(e=>setError(e.message))},[]);
 async function load(reset=true){if(!documentId)return;const requestId=++loadSequence.current;setError("");setStatus("Loading published facts from the selected budget PDF.");try{
   const base={municipality:MUNICIPALITY,document:documentId,limit:1000,cursor:reset?0:(nextCursor||0),...(FACT_MODE?filters:{period:edition?.fiscal_period_label})};
   const [factPayload,dimensionPayload,projectPayload]=await Promise.all([
    json(`/api/budgets/facts?${params(base)}`),
    json(`/api/budgets/dimensions?${params({municipality:MUNICIPALITY,document:documentId})}`),
    FACT_MODE?Promise.resolve({data:[]}):json(`/api/projects?${params({municipality:MUNICIPALITY,document:documentId,period:edition?.fiscal_period_label,limit:1000})}`)
   ]);
   let loadedFacts=factPayload.data,next=factPayload.pagination?.next_cursor??null;
   while(!FACT_MODE&&next!==null){const more=await json(`/api/budgets/facts?${params({...base,cursor:next})}`);loadedFacts=[...loadedFacts,...more.data];next=more.pagination?.next_cursor??null}
   if(requestId!==loadSequence.current)return;
   setFacts(reset?loadedFacts:[...facts,...loadedFacts]);setNextCursor(next);setDimensions(dimensionPayload.data);setProjects(projectPayload.data);setStatus(`${factPayload.coverage?.filtered_fact_count??loadedFacts.length} published facts match.`)
  }catch(e){if(requestId!==loadSequence.current)return;setError(e.message);setStatus("Load failed.")}}
 useEffect(()=>{if(documentId&&edition)load(true)},[documentId,edition?.fiscal_period_label]);
 const primaryFacts=useMemo(()=>facts.filter(f=>!FACT_MODE),[facts]);
 const revenue=primaryFacts.filter(f=>f.category_candidate_domain==="revenue"&&f.aggregation_role==="detail"&&f.amount_type==="budget");
 const expense=primaryFacts.filter(f=>f.category_candidate_domain==="expense"&&f.aggregation_role==="detail"&&f.amount_type==="budget");
 const revenueTotal=revenue.reduce((s,f)=>s+Number(f.value_numeric||0),0),expenseTotal=expense.reduce((s,f)=>s+Number(f.value_numeric||0),0);
 const reportedTotals=primaryFacts.filter(f=>["total","subtotal"].includes(f.aggregation_role)&&String(f.statement_kind).includes("operating"));
 const capital=primaryFacts.filter(f=>String(f.statement_kind).includes("capital"));
 const rates=primaryFacts.filter(f=>f.statement_kind==="tax_assessment_rate");
 const debt=primaryFacts.filter(f=>String(f.statement_kind).includes("debt"));
 const externalFunding=primaryFacts.filter(f=>f.amount_type==="funding_deduction");
 const editionOptions=editions.map(item=>({key:String(item.document_id),name:`${item.edition_label} - ${item.title}`}));
 const update=(key,value)=>setFilters(current=>({...current,[key]:value}));
 return <><Header/><main><p className="eyebrow">Charlottetown published budget data</p><h1>{FACT_MODE?"Budget fact explorer":"Municipal budget by year"}</h1><p className="lede">{FACT_MODE?"Inspect each published value, its source edition, statement context, assignment status, and available follow-up observation.":"View one annual budget PDF at a time. Tables retain source order, reported totals, fiscal labels, and exact fact evidence."}</p><Subnav/>
 <div className="controls"><div className="control grow"><label htmlFor="edition">Budget edition</label><select id="edition" value={documentId} onChange={e=>setDocumentId(e.target.value)}>{editionOptions.map(item=><option key={item.key} value={item.key}>{item.name}</option>)}</select></div><div className="status" role="status" aria-live="polite">{status}</div></div>
 {error&&<div className="notice error" role="alert">{error}</div>}
 {FACT_MODE?<FactExplorer dimensions={dimensions} filters={filters} update={update} load={()=>load(true)} facts={facts} edition={edition} nextCursor={nextCursor} loadMore={()=>load(false)}/>:<BudgetYear edition={edition} facts={primaryFacts} revenue={revenue} expense={expense} revenueTotal={revenueTotal} expenseTotal={expenseTotal} reportedTotals={reportedTotals} capital={capital} rates={rates} debt={debt} externalFunding={externalFunding} projects={projects}/>} </main></>
}
function BudgetYear({edition,facts,revenue,expense,revenueTotal,expenseTotal,reportedTotals,capital,rates,debt,externalFunding,projects}){
 const projectColumns=[{key:"name",label:"Project",render:p=><a href={`/budgets/facts?project=${encodeURIComponent(p.project_key)}`}>{p.name}</a>},{key:"department_name",label:"Department"},{key:"program_keys",label:"Program",render:p=>(p.program_keys||[]).join(", ")||"Unavailable"},{key:"gross_amount",label:"Gross",num:true,render:p=>money(p.gross_amount)},{key:"external_funding",label:"External funding",num:true,render:p=>money(p.external_funding)},{key:"net_amount",label:"Net",num:true,render:p=>money(p.net_amount)}];
 const factColumns=[{key:"statement_title",label:"Source section"},{key:"raw_label",label:"Line",render:f=>label(f)},{key:"amount_type",label:"Type"},{key:"aggregation_role",label:"Role"},{key:"value_numeric",label:"Value",num:true,render:f=>f.measure_unit==="cad"?money(f.value_numeric):number(f.value_numeric)},{key:"fact_id",label:"Evidence",render:f=><a href={`/api/budgets/facts/${f.fact_id}?municipality=${MUNICIPALITY}`}>Fact {f.fact_id}</a>}];
 return <>{edition&&<div className="notice"><strong>{edition.edition_label} budget PDF.</strong> Primary fiscal period: {edition.fiscal_period_label}. The subsequent forecast column is available only for uniquely matched operating facts reported in {edition.subsequent_document_title||"a later budget document"}.</div>}
 <section className="cards"><article className="card"><span>Proposed revenue subtotal</span><strong>{money(revenueTotal)}</strong><small>{revenue.length} classified detail facts</small></article><article className="card"><span>Proposed expense subtotal</span><strong>{money(expenseTotal)}</strong><small>{expense.length} classified detail facts</small></article><article className="card"><span>Expenditures minus revenue</span><strong>{money(expenseTotal-revenueTotal)}</strong><small>Proposed classified coverage only</small></article><article className="card"><span>Published projects</span><strong>{projects.length}</strong><small>{edition?.edition_label}</small></article></section>
 <section className="panel"><h2>Operating revenues and expenses</h2><p className="panel-intro">Revenue and expense classifications are proposed taxonomy assignments for browser review. Source-reported totals remain separate below and are not replaced by these subtotals.</p><div className="pair"><FactTable title="Revenue" rows={revenue}/><FactTable title="Expenses" rows={expense}/></div><div className="net"><span>Net expenditures from classified detail facts: expenditures minus revenue</span><strong>{money(expenseTotal-revenueTotal)}</strong></div></section>
 <section className="panel"><h2>Source-reported operating subtotals and totals</h2><p className="panel-intro">These rows are preserved from the selected PDF. They provide the municipal, department, and facility totals used to evaluate the proposed detail classification.</p><CompactTable rows={reportedTotals} columns={factColumns}/></section>
 <section className="panel"><h2>Capital programs and projects</h2><p className="panel-intro">Programs use explicit source-page headings. Projects remain municipality-scoped and are filtered to facts from this budget edition.</p><CompactTable rows={projects} columns={projectColumns}/><h3>Capital schedule facts</h3><CompactTable rows={capital} columns={factColumns}/></section>
 <section className="panel"><h2>Tax rates, assessments, and calculations</h2><CompactTable rows={rates} columns={factColumns}/></section>
 <section className="panel"><h2>Debt servicing</h2><CompactTable rows={debt} columns={factColumns}/></section>
 <section className="panel"><h2>External funding and partner contributions</h2><p className="panel-intro">Funding deductions are shown separately and remain in their source capital schedules above.</p><CompactTable rows={externalFunding} columns={factColumns}/></section>
 <section className="panel"><h2>Downloads and sources</h2><div className="actions"><a href={`/api/budgets/download.csv?${params({municipality:MUNICIPALITY,document:edition?.document_id,period:edition?.fiscal_period_label,limit:1000})}`}>Download selected facts CSV</a><a href={`/api/budgets/sources/${edition?.document_id}/pages/1?municipality=${MUNICIPALITY}`} target="_blank" rel="noreferrer">Open source PDF page 1</a><a href="/budgets/facts">Inspect all facts</a></div></section></>
}
function FactExplorer({dimensions,filters,update,load,facts,edition,nextCursor,loadMore}){
 const columns=[{key:"fact_id",label:"Fact",render:f=><a href={`/api/budgets/facts/${f.fact_id}?municipality=${MUNICIPALITY}`}>{f.fact_id}</a>},{key:"statement_title",label:"Statement / hierarchy",render:f=><>{f.reporting_entity_name}<br/><span className="group">{f.effective_organization_unit_name||"No department"} / {f.program_name||"No program"}<br/>{f.statement_title}</span></>},{key:"raw_label",label:"Source line",render:f=>label(f)},{key:"amount_type",label:"Observation"},{key:"aggregation_role",label:"Role"},{key:"value_numeric",label:"Value",num:true,render:f=>f.value_numeric===null?f.value_text:(f.measure_unit==="cad"?money(f.value_numeric):number(f.value_numeric))},{key:"category_candidate_key",label:"Category",render:f=>f.category_candidate_key?<><span className={`badge ${f.category_assignment_status}`}>{f.category_assignment_status}</span><br/>{f.category_candidate_key}</>:"Unassigned"},{key:"followup_value_numeric",label:"Follow-up",num:true,render:f=>f.followup_fact_id?<>{money(f.followup_value_numeric)}<br/><span className="group">{f.followup_fiscal_period_label} {f.followup_observation_kind}</span></>:"Unavailable"}];
 return <><section className="panel"><h2>What is a fact</h2><div className="facts-grid"><article className="definition"><h3>One observation</h3><p>A fact is one reviewed value or text observation for one source line, fiscal period, amount type, and unit.</p></article><article className="definition"><h3>Source context</h3><p>Statement, row order, department, program, project, aggregation role, and source-cell identifiers explain where the observation belongs.</p></article><article className="definition"><h3>Assignment status</h3><p>Approved mappings use explicit source evidence. Proposed categories are browser-review candidates and do not replace raw labels.</p></article></div></section>
 <section className="panel"><h2>Filter and iterate</h2><div className="controls"><Select name="department" value={filters.department} onChange={v=>update("department",v)} options={dimensions.departments||[]}/><Select name="program" value={filters.program} onChange={v=>update("program",v)} options={dimensions.programs||[]}/><Select name="project" value={filters.project} onChange={v=>update("project",v)} options={dimensions.projects||[]}/><Select name="category" value={filters.category} onChange={v=>update("category",v)} options={dimensions.categories||[]}/><Select name="category_status" value={filters.category_status} onChange={v=>update("category_status",v)} options={[{value:"proposed"},{value:"approved"},{value:"unassigned"}]}/><Select name="statement_kind" value={filters.statement_kind} onChange={v=>update("statement_kind",v)} options={(dimensions.statement_kinds||[]).map(value=>({value}))}/><Select name="amount_type" value={filters.amount_type} onChange={v=>update("amount_type",v)} options={(dimensions.amount_types||[]).map(value=>({value}))}/><Select name="aggregation_role" value={filters.aggregation_role} onChange={v=>update("aggregation_role",v)} options={["detail","subtotal","total","memo","non_additive"].map(value=>({value}))}/><div className="control grow"><label htmlFor="q">Search labels</label><input id="q" value={filters.q} onChange={e=>update("q",e.target.value)}/></div><button className="button" onClick={load}>Apply filters</button></div><p className="panel-intro">Edition: {edition?.title}. Filters are enforced in the database query. Empty results mean no published fact meets every selected condition.</p><CompactTable rows={facts} columns={columns}/>{nextCursor&&<div className="pagination"><button className="button" onClick={loadMore}>Load next page</button></div>}</section></>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>

}
function draftPolygonStyle(color) {
  return { color: "rgba(26,22,18,0)", weight: 0, opacity: 0, fillColor: color, fillOpacity: 0.75 };
}
function buildingStyle() {
  return { color: "rgba(54,102,76,0.58)", weight: 0.6, opacity: 0.85, fillColor: "#d8c3a2", fillOpacity: 0.2 };
}

function Header() {
  return <header className="app-header"><img src="../../assets/logo-island-needle.svg" alt="Modern Democracy" className="wm" /><nav><a href="/parcel-lookup">Parcel lookup</a><a href="/zoning-comparison">Compare bylaws</a><a className="active" href="/council-meetings">Council meetings</a><a href="/restriction-stack">View Spatial Restrictions</a><a href="/city-view">Map</a></nav></header>;
}

function AgendaTree({ audience, setAudience, selectedId, onSelect, payload }) {
  const agendaTree = buildAgendaTree(payload);
  return <aside className="agenda-panel">
    <div className="tabs" aria-label="Audience tabs">{["public", "council", "staff"].map((name) => <button type="button" key={name} className={audience === name ? "active" : ""} onClick={() => setAudience(name)}>{name[0].toUpperCase() + name.slice(1)}</button>)}</div>
    <h2 className="section-title">Agenda Tree</h2>
    <div className="tree">{agendaTree.map((group) => <details className="tree-group" open={group.open} key={group.group}><summary>{group.group}</summary><div className="tree-items">{group.items.map((item) => <button type="button" className={`tree-button ${selectedId === item.id ? "active" : ""}`} onClick={() => onSelect(item.id)} key={item.id}><span className="label">{item.label}</span><span className="title">{item.title}</span></button>)}</div></details>)}</div>
  </aside>;
}

function GeneralInfo({ audience, payload }) {
  const copy = AUDIENCE_COPY[audience];
  return <><div className="main-header"><div className="section-title">{payload.meeting.date} at {payload.meeting.time}</div><h1>{copy.title}</h1><p>{copy.summary}</p></div><div className="content-scroll"><div className="info-grid">{copy.cards.map(([title, body]) => <article className="info-card" key={title}><h2>{title}</h2><p>{body}</p></article>)}</div><div className="package-card" style={{marginTop: 14}}><h2>Meeting Information</h2><div className="meta-grid"><div className="k">Body</div><div className="v">{payload.meeting.body}</div><div className="k">Location</div><div className="v">{payload.meeting.location}</div><div className="k">Stream</div><div className="v"><a href={payload.meeting.livestream_url}>{payload.meeting.livestream_url}</a></div><div className="k">Sources</div><div className="v">{payload.sourceDocuments.length} PDFs</div></div></div></div></>;
}

function ItemHeader({ treeItem, record }) {
  return <div className="main-header">
    <div className="section-title">Agenda item {treeItem.label}</div>
    <h1>{record?.title || record?.title_raw || treeItem.title}</h1>
    <p>{record?.public_summary || record?.summary || record?.decision_requested || "Agenda source text is shown below."}</p>
    <div className="badge-row">{record?.stage && <span className="badge urgent">{record.stage.replaceAll("_", " ")}</span>}{record?.zoning_amendment && <span className="badge">{record.zoning_amendment.from_zone} to {record.zoning_amendment.to_zone}</span>}{itemPids(record).map((pid) => <span className="badge" key={pid}>PID {pid}</span>)}</div>
  </div>;
}

function AgendaPackagePane({ payload, record, treeItem }) {
  const [sourcePage, setSourcePage] = useState(null);
  const [sourceChoice, setSourceChoice] = useState(() => citationPage(record, treeItem));
  useEffect(() => { setSourceChoice(citationPage(record, treeItem)); }, [record?.item_id, record?.planning_item_id, treeItem?.id]);
  useEffect(() => {
    if (!sourceChoice?.documentId || !sourceChoice?.page) return;
    fetchJson(`/api/council-meetings/current/source-page?documentId=${encodeURIComponent(sourceChoice.documentId)}&page=${encodeURIComponent(sourceChoice.page)}`)
      .then(setSourcePage)
      .catch((error) => setSourcePage({ text: `Unable to load source page: ${error.message}` }));
  }, [sourceChoice.documentId, sourceChoice.page]);
  const pageOptions = (record?.citations || []).map((citation) => ({ documentId: citation.source_document_id, page: citation.pdf_page_start, label: `${citation.source_document_id} page ${citation.pdf_page_start}` }));
  if (!pageOptions.length) pageOptions.push({ ...sourceChoice, label: `${sourceChoice.documentId} page ${sourceChoice.page}` });
  const linkedDocuments = documentsForItem(payload, treeItem?.id, record);
  return <div className="content-scroll">
    {linkedDocuments.length > 0 && <div className="document-list">{linkedDocuments.map((document) => <article className="document-item" key={document.document_id}><h2>{document.title}</h2><p>{document.summary}</p><div className="meta">package pages {document.page_start}-{document.page_end} &middot; {document.page_count} page{document.page_count === 1 ? "" : "s"}{document.template_type ? ` \u00b7 ${document.template_type}` : ""}</div></article>)}</div>}
    <select className="source-select" value={`${sourceChoice.documentId}:${sourceChoice.page}`} onChange={(event) => { const [documentId, page] = event.target.value.split(":"); setSourceChoice({ documentId, page: Number(page) }); }}>{pageOptions.map((option) => <option value={`${option.documentId}:${option.page}`} key={`${option.documentId}-${option.page}`}>{option.label}</option>)}</select>
    <article className="package-card"><h2>{sourceChoice.documentId} package text, page {sourceChoice.page}</h2><pre className="package-text">{sourcePage?.text || "Loading source page."}</pre></article>
  </div>;
}

function paragraphize(text) {
  return String(text || "")
    .split(/\n{2,}/)
    .map((part) => part.replace(/\n/g, " ").replace(/\s+/g, " ").trim())
    .filter(Boolean);
}

function MeetingMinutesPane({ record }) {
  const start = record?.package_page_start || 3;
  const end = record?.package_page_end || start;
  const [pages, setPages] = useState([]);
  useEffect(() => {
    let cancelled = false;
    Promise.all(Array.from({ length: end - start + 1 }, (_, index) => {
      const page = start + index;
      return fetchJson(`/api/council-meetings/current/source-page?documentId=package&page=${page}`)
        .then((payload) => ({ page, text: payload.text }))
        .catch((error) => ({ page, text: `Unable to load page ${page}: ${error.message}` }));
    })).then((results) => {
      if (!cancelled) setPages(results);
    });
    return () => { cancelled = true; };
  }, [start, end]);
  return <div className="content-scroll"><div className="minutes-doc">{pages.length ? pages.map((page) => <article className="minutes-page" key={page.page}><h2>Package page {page.page}</h2>{paragraphize(page.text).map((paragraph, index) => <p key={index}>{paragraph}</p>)}</article>) : <article className="minutes-page"><h2>Minutes</h2><p>Loading minutes text.</p></article>}</div></div>;
}

function ParcelLookupPane({ itemId }) {
  const mapRef = useRef(null);
  const elementRef = useRef(null);
  const selectedLayerRef = useRef(null);
  const visibleLayerRefs = useRef({ current: null, draft: null, buildings: null, parcels: null });
  const requestRef = useRef(0);
  const timerRef = useRef(null);
  const [status, setStatus] = useState("Loading item parcels.");
  const [layers, setLayers] = useState({ current: true, draft: true, buildings: true, parcels: true });
  const [counts, setCounts] = useState({ current: 0, draft: 0, buildings: 0, parcels: 0 });
  useEffect(() => {
    if (!elementRef.current || mapRef.current) {
      return;
    }
    mapRef.current = L.map(elementRef.current).setView(CENTER, 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 20, attribution: "&copy; OpenStreetMap contributors" }).addTo(mapRef.current);
    L.control.scale({ metric: true, imperial: false }).addTo(mapRef.current);
    mapRef.current.createPane("buildingsPane");
    mapRef.current.createPane("zonesPane");
  }, []);
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    let cancelled = false;
    fetchJson(`/api/council-meetings/current/items/${encodeURIComponent(itemId)}/parcels`).then((payload) => {
      if (cancelled) return;
      if (selectedLayerRef.current) selectedLayerRef.current.remove();
      const features = (payload.parcels || []).filter((row) => row.parcel?.geometry).map((row) => ({ type: "Feature", geometry: row.parcel.geometry, properties: { pid: row.pid, address: row.address?.label || `PID ${row.pid}`, currentZone: row.zones?.current?.code || "" } }));
      selectedLayerRef.current = L.geoJSON({ type: "FeatureCollection", features }, { style: (feature) => ({ color: "#8f3d2f", weight: 3, fillColor: zoneColor(feature.properties.currentZone), fillOpacity: 0.18 }), onEachFeature: (feature, layer) => layer.bindTooltip(`${feature.properties.address}<br>PID ${feature.properties.pid}`, { sticky: true }) }).addTo(map);
      const bounds = selectedLayerRef.current.getBounds();
      if (bounds.isValid()) map.fitBounds(bounds.pad(1.2), { maxZoom: 16, animate: false, padding: [28, 28] });
      setStatus(`${features.length} selected parcel${features.length === 1 ? "" : "s"} loaded: ${payload.pids.join(", ")}.`);
      window.setTimeout(() => map.invalidateSize(), 0);
    }).catch((error) => setStatus(error.message || "Parcel lookup failed."));
    return () => { cancelled = true; };
  }, [itemId]);
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    const clearVisibleLayer = (key) => {
      if (visibleLayerRefs.current[key]) {
        visibleLayerRefs.current[key].remove();
        visibleLayerRefs.current[key] = null;
      }
    };
    const loadVisibleLayers = async () => {
      const requestId = ++requestRef.current;
      const bbox = mapBboxString(map);
      const detail = mapLayerMode(map);
      const requests = [];
      if (layers.buildings) requests.push(["buildings", fetchJson(`/api/buildings/osm.geojson?bbox=${bbox}&limit=${mapLayerLimit(map, "buildings")}&detail=${detail}`)]);
      if (layers.current) requests.push(["current", fetchJson(`/api/zoning/current.geojson?bbox=${bbox}&limit=${mapLayerLimit(map, "current")}&detail=${detail}`)]);
      if (layers.draft) requests.push(["draft", fetchJson(`/api/zoning/draft.geojson?bbox=${bbox}&limit=${mapLayerLimit(map, "draft")}&detail=${detail}`)]);
      if (layers.parcels) requests.push(["parcels", fetchJson(`/api/parcels.geojson?bbox=${bbox}&limit=${mapLayerLimit(map, "parcels")}&detail=${detail}`)]);
      const results = await Promise.allSettled(requests.map(async ([key, promise]) => [key, await promise]));
      if (requestId !== requestRef.current) return;
      Object.keys(visibleLayerRefs.current).forEach(clearVisibleLayer);
      const nextCounts = { current: 0, draft: 0, buildings: 0, parcels: 0 };
      results.forEach((result) => {
        if (result.status !== "fulfilled") return;
        const [key, geojson] = result.value;
        nextCounts[key] = geojson.features?.length || 0;
        if (key === "buildings") visibleLayerRefs.current.buildings = L.geoJSON(geojson, { pane: "buildingsPane", style: buildingStyle, interactive: false }).addTo(map);
        if (key === "current") visibleLayerRefs.current.current = L.geoJSON(geojson, { pane: "zonesPane", style: (feature) => currentPolygonStyle(zoneColor(feature.properties?.zoneCode)), interactive: false }).addTo(map);
        if (key === "draft") visibleLayerRefs.current.draft = L.geoJSON(geojson, { pane: "zonesPane", style: (feature) => draftPolygonStyle(zoneColor(feature.properties?.zoneCode)), interactive: false }).addTo(map);
        if (key === "parcels") visibleLayerRefs.current.parcels = L.geoJSON(geojson, { style: { color: "rgba(26,22,18,0.35)", weight: 0.6, fillOpacity: 0 }, interactive: false }).addTo(map);
      });
      selectedLayerRef.current?.bringToFront();
      setCounts(nextCounts);
    };
    const scheduleLoad = () => {
      window.clearTimeout(timerRef.current);
      timerRef.current = window.setTimeout(loadVisibleLayers, 160);
    };
    map.on("moveend zoomend", scheduleLoad);
    scheduleLoad();
    return () => {
      map.off("moveend zoomend", scheduleLoad);
      window.clearTimeout(timerRef.current);
    };
  }, [layers]);
  const toggleLayer = (key) => setLayers((current) => ({ ...current, [key]: !current[key] }));
  return <div className="map-shell"><div className="tool-status">{status}</div><div className="parcel-map-body"><div ref={elementRef} className="tool-map" aria-label="Rezoning item parcel map"></div><aside className="parcel-layer-panel"><h2 className="section-title">Layers</h2>{[["current", "Current zoning", "var(--brick)"], ["draft", "Draft zoning", "var(--ochre)"], ["buildings", "Buildings", "#d8c3a2"], ["parcels", "Parcel outlines", "var(--paper-2)"]].map(([key, label, color]) => <label className="layer" key={key}><input type="checkbox" checked={layers[key]} onChange={() => toggleLayer(key)} /><span className="sw" style={{background: color}}></span><span className="name">{label}</span><span className="count">{counts[key]}</span></label>)}</aside></div></div>;
}

function ComparisonRows({ rows }) {
  return <div className="compare-grid"><div className="diff-cell current"><span className="value">Current bylaw from-zone</span></div><div className="diff-cell label">Field</div><div className="diff-cell"><span className="value">Current bylaw to-zone</span></div>{rows.map((row, index) => <React.Fragment key={`${row.label}-${index}`}><div className="diff-cell current"><span className="value">{row.current || "pending"}</span></div><div className="diff-cell label">{row.label}</div><div className="diff-cell"><span className="value">{row.draft || "pending"}</span></div></React.Fragment>)}</div>;
}
function CitationList({ title, sections }) {
  return <section className="citation-card"><h2>{title}</h2><div className="citation-list">{sections?.length ? sections.map((section, index) => <article className="citation-item" key={`${section.sectionId}-${index}`}><div className="title">{section.label} {section.title}</div><div className="meta">{section.filePath || "source path pending"}</div>{(section.clauses || []).map((clause, clauseIndex) => <div className="clause" key={clauseIndex}>{clause.label && <span className="clause-label">{clause.label}</span>}<span>{clause.text || ""}</span></div>)}</article>) : <div className="status-card">Zone-section citations pending.</div>}</div></section>;
}
function StructuredView({ structuredData }) {
  const groups = structuredData?.groups || [];
  if (!groups.length) return <div className="structured-empty">Structured data is pending for this current-bylaw zone comparison.</div>;
  return <div className="structured-view">{groups.map((group) => <section className="structured-group" key={group.key || group.title}><h2>{group.title}</h2>{group.rows?.length ? <ComparisonRows rows={group.rows} /> : <div className="structured-empty">No structured rows found.</div>}</section>)}</div>;
}
function ComparePane({ itemId }) {
  const [payload, setPayload] = useState(null);
  const [status, setStatus] = useState("Loading current bylaw comparison.");
  const [mode, setMode] = useState("raw");
  useEffect(() => { let cancelled = false; fetchJson(`/api/council-meetings/current/items/${encodeURIComponent(itemId)}/comparison`).then((data) => { if (!cancelled) { setPayload(data); setStatus(data.citations?.note || "Loaded."); } }).catch((error) => setStatus(error.message || "Comparison failed.")); return () => { cancelled = true; }; }, [itemId]);
  return <div className="compare-shell"><div className="compare-actions"><button type="button" className={mode === "raw" ? "active" : ""} onClick={() => setMode("raw")}>Raw bylaw</button><button type="button" className={mode === "structured" ? "active" : ""} onClick={() => setMode("structured")}>Structured data</button></div>{!payload ? <div className="status-card">{status}</div> : <><ComparisonRows rows={payload.rows || []} />{mode === "raw" ? <div className="citation-grid"><CitationList title={`${payload.zones?.from?.code || "From"} current bylaw`} sections={payload.citations?.from || payload.citations?.current || []} /><CitationList title={`${payload.zones?.to?.code || "To"} current bylaw`} sections={payload.citations?.to || payload.citations?.draft || []} /></div> : <StructuredView structuredData={payload.structuredData} />}</>}</div>;
}

function featureStyle(feature) {
  const kind = feature.properties?.kind;
  if (kind === "selected_parcel") return { color: "#1a1612", weight: 2.4, fillOpacity: 0.05 };
  if (kind === "neighbor_parcel") return { color: "rgba(26,22,18,0.35)", weight: 0.7, fillOpacity: 0 };
  if (kind === "building") return { color: "#1a1612", weight: 1, fillColor: "#d8c3a2", fillOpacity: 0.72 };
  if (kind === "road") return { color: "#fffaf0", weight: 18, opacity: 0.96, lineCap: "round", lineJoin: "round" };
  return { color: "#8f3d2f", weight: 1.4, fillColor: "#8f3d2f", fillOpacity: 0.24, opacity: 0.95 };
}
function RestrictionMap({ title, zone, geojson }) {
  const elementRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  useEffect(() => {
    if (!elementRef.current || mapRef.current) return;
    mapRef.current = L.map(elementRef.current, { attributionControl: false }).setView(CENTER, 17);
    L.control.scale({ metric: true, imperial: false }).addTo(mapRef.current);
    return () => mapRef.current?.remove();
  }, []);
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (layerRef.current) layerRef.current.remove();
    layerRef.current = L.geoJSON(geojson || { type: "FeatureCollection", features: [] }, { style: featureStyle, onEachFeature: (feature, layer) => { const p = feature.properties || {}; const label = p.regulationLabel ? `${p.regulationLabel}: ${p.yardRole}, ${p.distanceM} m` : p.name || p.parcelId || p.kind; if (label) layer.bindTooltip(label, { sticky: true }); } }).addTo(map);
    const selected = L.geoJSON(geojson || {}, { filter: (feature) => feature.properties?.kind === "selected_parcel" });
    const bounds = selected.getBounds();
    if (bounds.isValid()) map.fitBounds(bounds.pad(1.2), { animate: false, padding: [28, 28] });
    window.setTimeout(() => map.invalidateSize(), 0);
  }, [geojson]);
  return <section className="restriction-pane"><div className="pane-head"><span>{title}</span><span>{zone?.code || "pending"}</span></div><div ref={elementRef} className="restriction-map"></div></section>;
}
function RestrictionsPane({ itemId }) {
  const [payload, setPayload] = useState(null);
  const [status, setStatus] = useState("Loading current bylaw spatial restrictions.");
  useEffect(() => { let cancelled = false; fetchJson(`/api/council-meetings/current/items/${encodeURIComponent(itemId)}/restriction-stack`).then((data) => { if (!cancelled) { setPayload(data); setStatus("Loaded current bylaw restriction panes."); } }).catch((error) => setStatus(error.message || "Restrictions failed.")); return () => { cancelled = true; }; }, [itemId]);
  return <div className="restriction-shell"><div className="tool-status">{status}</div><main className="restriction-grid"><RestrictionMap title="From-zone restrictions" zone={payload?.zones?.from || payload?.zones?.current} geojson={payload?.current} /><RestrictionMap title="To-zone restrictions" zone={payload?.zones?.to || payload?.zones?.draft} geojson={payload?.draft} /></main></div>;
}

function ShadowPane({ itemId, record }) {
  const pid = itemPids(record)[0] || "";
  const src = pid ? `/parcel-3d?pid=${encodeURIComponent(pid)}` : "/parcel-3d";
  useEffect(() => { fetchJson(`/api/council-meetings/current/items/${encodeURIComponent(itemId)}/3d-context`).catch(() => null); }, [itemId]);
  return <div className="map-shell"><div className="tool-status">Shadow Study for selected council rezoning item. Primary loaded PID: {pid || "pending"}.</div><iframe className="shadow-frame" title="Shadow Study" src={src}></iframe></div>;
}

function SelectedItemView({ payload, selectedId, toolMode }) {
  const treeItem = allItems(payload).find((item) => item.id === selectedId);
  const record = findRecord(payload, selectedId);
  if (!treeItem) return null;
  return <><ItemHeader treeItem={treeItem} record={record} />{treeItem.minutes ? <MeetingMinutesPane record={record} /> : toolMode === "parcel" && record?.zoning_amendment ? <ParcelLookupPane itemId={record.item_id || record.planning_item_id || selectedId} /> : toolMode === "compare" && record?.zoning_amendment ? <ComparePane itemId={record.item_id || record.planning_item_id || selectedId} /> : toolMode === "restrictions" && record?.zoning_amendment ? <RestrictionsPane itemId={record.item_id || record.planning_item_id || selectedId} /> : toolMode === "shadow" && record?.zoning_amendment ? <ShadowPane itemId={record.item_id || record.planning_item_id || selectedId} record={record} /> : <AgendaPackagePane payload={payload} record={record} treeItem={treeItem} />}</>;
}

function ContextPanel({ audience, payload, selectedId, toolMode, setToolMode }) {
  const treeItem = allItems(payload).find((item) => item.id === selectedId);
  const record = findRecord(payload, selectedId);
  const workflow = payload.audienceWorkflows.find((candidate) => audience === "public" ? candidate.audience === "public_member" : audience === "council" ? candidate.audience === "council_or_committee" : candidate.audience === "municipal_staff");
  const isRezoning = Boolean(record?.zoning_amendment);
  const linkedDocuments = documentsForItem(payload, selectedId, record);
  return <aside className="context-panel">
    <section className="context-card"><h2>{audience === "public" ? "Public needs" : audience === "council" ? "Council needs" : "Staff needs"}</h2><ul className="workflow-list">{(workflow?.stages || []).flatMap((stage) => stage.tasks).map((task) => <li key={task}>{task}</li>)}</ul></section>
    <section className="context-card"><h2>Agenda Context</h2>{selectedId ? <div className="meta-grid"><div className="k">Item</div><div className="v">{treeItem?.label} {treeItem?.title}</div><div className="k">Stage</div><div className="v">{record?.stage || "not extracted"}</div><div className="k">Decision</div><div className="v">{record?.decision_requested || "not extracted"}</div></div> : <p className="empty-note">Select an agenda item for item-specific context.</p>}</section>
    {selectedId && <section className="context-card"><h2>Package Documents</h2>{linkedDocuments.length ? <ul className="check-list">{linkedDocuments.map((document) => <li key={document.document_id}>{document.title}: pages {document.page_start}-{document.page_end}</li>)}</ul> : <p className="empty-note">No package document has been linked to this item yet.</p>}</section>}
    {record?.source_links?.length > 0 && <section className="context-card"><h2>Related Source Links</h2><ul className="check-list">{record.source_links.map((link) => <li key={`${link.documentId}-${link.page}-${link.label}`}><a href={`/api/council-meetings/current/source-page?documentId=${encodeURIComponent(link.documentId)}&page=${encodeURIComponent(link.page)}`} target="_blank" rel="noreferrer">{link.label}</a></li>)}</ul></section>}
    {isRezoning && <section className="context-card"><h2>Rezoning Tools</h2><div className="route-actions">{[["package", "View Agenda Package"], ["parcel", "View Parcel On Map"], ["compare", "Compare bylaws"], ["restrictions", "View Spatial Restrictions"], ["shadow", "Shadow Study"]].map(([key, label]) => <button type="button" className={`btn btn-primary ${toolMode === key ? "active" : ""}`} onClick={() => setToolMode(key)} key={key}>{label}</button>)}</div></section>}
    <section className="context-card"><h2>Interface Controls</h2><ul className="check-list"><li>Use the left tree to follow agenda order.</li><li>Use View Agenda Package to restore the source page listing.</li><li>Rezoning tools replace the middle pane without leaving this page.</li></ul></section>
  </aside>;
}

function App() {
  const [payload, setPayload] = useState(null);
  const [status, setStatus] = useState("loading");
  const [audience, setAudience] = useState("public");
  const [selectedId, setSelectedId] = useState("");
  const [toolMode, setToolMode] = useState("package");
  useEffect(() => { lucide.createIcons(); });
  useEffect(() => { fetchJson("/api/council-meetings/current").then((data) => { setPayload(data); setStatus("ready"); }).catch((error) => setStatus(error.message)); }, []);
  const selectItem = (id) => { setSelectedId(id); setToolMode("package"); };
  if (status !== "ready") return <><Header /><main className="content-scroll">{status === "loading" ? "Loading meeting data." : status}</main></>;
  return <div className="meeting-app"><Header /><div className="meeting-workspace"><AgendaTree audience={audience} setAudience={setAudience} selectedId={selectedId} onSelect={selectItem} payload={payload} /><main className="main-panel">{selectedId ? <SelectedItemView payload={payload} selectedId={selectedId} toolMode={toolMode} /> : <GeneralInfo audience={audience} payload={payload} />}</main><ContextPanel audience={audience} payload={payload} selectedId={selectedId} toolMode={toolMode} setToolMode={setToolMode} /></div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

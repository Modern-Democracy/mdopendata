<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council Meeting - Modern Democracy</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../parcel-lookup/styles.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); }
  .meeting-app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; overflow: hidden; }
  .meeting-workspace { display: grid; grid-template-columns: 330px minmax(0, 1fr) 330px; min-height: 0; overflow: hidden; }
  .agenda-panel, .context-panel { background: var(--paper-2); overflow-y: auto; padding: 16px; }
  .agenda-panel { border-right: 1px solid var(--border-hair); }
  .context-panel { border-left: 1px solid var(--border-hair); }
  .main-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; background: var(--paper); }
  .main-header { border-bottom: 1px solid var(--border-hair); background: var(--paper-2); padding: 16px 18px; }
  .main-header h1 { font-size: 28px; line-height: 1.06; margin: 0 0 8px; overflow-wrap: anywhere; }
  .main-header p { font-size: 13px; color: var(--fg-3); margin: 0; max-width: 90ch; }
  .content-scroll { overflow-y: auto; padding: 18px; }
  .section-title { font: 700 11px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 10px; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border: 1px solid var(--border-hair); border-radius: 6px; background: var(--paper); margin-bottom: 16px; }
  .tabs button { border: 0; border-radius: 4px; background: transparent; color: var(--fg-3); cursor: pointer; font: 700 12px var(--font-ui); padding: 8px; }
  .tabs button.active { background: var(--ink); color: var(--paper); }
  .tree { display: grid; gap: 8px; }
  details.tree-group { border: 1px solid var(--border-hair); border-radius: 6px; background: var(--paper); overflow: hidden; }
  details.tree-group > summary { cursor: pointer; padding: 10px 11px; font: 700 12px var(--font-ui); color: var(--ink); list-style: none; border-bottom: 1px solid var(--border-hair); }
  details.tree-group > summary::-webkit-details-marker { display: none; }
  .tree-items { display: grid; gap: 0; padding: 5px; }
  .tree-button { width: 100%; border: 0; border-radius: 4px; background: transparent; color: var(--fg-2); cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 8px; padding: 8px; text-align: left; font: 13px var(--font-ui); }
  .tree-button.active { background: var(--paper-3); color: var(--ink); box-shadow: inset 3px 0 0 var(--brick); }
  .tree-button .label { font: 700 11px var(--font-mono); color: var(--fg-3); letter-spacing: 0; text-transform: none; }
  .tree-button .title { overflow-wrap: anywhere; }
  .info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .info-card, .context-card, .package-card { border: 1px solid var(--border-hair); border-radius: 6px; background: var(--paper-2); padding: 14px; }
  .info-card h2, .context-card h2, .package-card h2 { font: 700 15px var(--font-ui); margin: 0 0 8px; }
  .info-card p, .context-card p { color: var(--fg-2); font-size: 13px; margin: 0; }
  .workflow-list, .check-list { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 13px; }
  .workflow-list li, .check-list li { margin-bottom: 7px; }
  .package-text { white-space: pre-wrap; font: 13px/1.55 var(--font-ui); color: var(--fg-2); margin: 0; }
  .badge-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .badge { border: 1px solid var(--border-hair); border-radius: 3px; background: var(--paper); color: var(--fg-2); font: 700 11px var(--font-mono); padding: 3px 7px; }
  .badge.urgent { background: var(--brick-wash); color: var(--brick-ink); border-color: rgba(168,57,28,0.25); }
  .route-actions { display: grid; gap: 8px; }
  .route-actions .btn { width: 100%; justify-content: center; }
  .meta-grid { display: grid; grid-template-columns: 92px 1fr; gap: 7px 10px; font-size: 12.5px; }
  .meta-grid .k { color: var(--fg-3); font-family: var(--font-mono); text-transform: uppercase; font-size: 10.5px; }
  .meta-grid .v { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .source-select { width: 100%; border: 1px solid var(--border-hair); border-radius: 4px; background: var(--paper); color: var(--ink); padding: 8px; font: 13px var(--font-ui); margin-bottom: 12px; }
  .empty-note { color: var(--fg-3); font-size: 13px; }
  @media (max-width: 1060px) {
    .meeting-app { height: auto; min-height: 100vh; overflow: visible; }
    .meeting-workspace { grid-template-columns: 1fr; overflow: visible; }
    .agenda-panel, .context-panel, .content-scroll { overflow: visible; }
    .main-panel { overflow: visible; }
    .info-grid { grid-template-columns: 1fr; }
  }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useMemo, useState } = React;

const AGENDA_TREE = [
  { group: "Opening", open: true, items: [
    { id: "agenda-1", label: "1", title: "Call to Order", page: 1 },
    { id: "agenda-2", label: "2", title: "Declaration of Conflict of Interest", page: 1 },
    { id: "agenda-3", label: "3", title: "Approval of Agenda", page: 1 },
    { id: "agenda-4", label: "4", title: "Adoption of Previous Draft Minutes of Council", page: 1 },
    { id: "agenda-5", label: "5", title: "Business Arising out of the Minutes", page: 1 },
    { id: "agenda-6", label: "6", title: "Council Inquiries to be taken Under Consideration", page: 1 },
  ]},
  { group: "Reports of Standing Committees", open: true, items: [
    { id: "agenda-7-1-planning-heritage", label: "7.1", title: "Planning & Heritage", page: 11, packagePage: 11 },
    { id: "agenda-7-2", label: "7.2", title: "Environment & Sustainability", page: 2 },
    { id: "agenda-7-3", label: "7.3", title: "Finance, Audit, Tendering & Administration", page: 1 },
    { id: "agenda-7-4", label: "7.4", title: "Human Resources", page: 1 },
    { id: "agenda-7-5", label: "7.5", title: "Strategic Priorities, Communications & Intergovernmental Cooperation", page: 1 },
    { id: "agenda-7-6", label: "7.6", title: "Protective & Emergency Services", page: 2 },
    { id: "agenda-7-7", label: "7.7", title: "Parks, Recreation & Leisure Activities", page: 2 },
    { id: "agenda-7-8", label: "7.8", title: "Water & Sewer Utility", page: 2 },
    { id: "agenda-7-9", label: "7.9", title: "Economic, Tourism & Cultural Development", page: 2 },
    { id: "agenda-7-10", label: "7.10", title: "Public Works", page: 2 },
    { id: "agenda-7-11-new-business", label: "7.11", title: "New Business", page: 2 },
  ]},
  { group: "Planning & Heritage Rezoning Items", open: true, items: [
    { id: "bylaw-reading-ph-zd-2-110-231-brackley-point-road", label: "7.1a", title: "231 Brackley Point Road rezoning", page: 6, packagePage: 6, rezoning: true },
    { id: "bylaw-reading-ph-zd-2-109-king-dorchester", label: "7.1b", title: "King and Dorchester Streets rezoning", page: 5, packagePage: 5, rezoning: true },
  ]},
  { group: "Close", open: false, items: [
    { id: "agenda-8", label: "8", title: "Closed Session Motion", page: 2 },
    { id: "agenda-9", label: "9", title: "Business Arising from Closed Session", page: 2 },
    { id: "agenda-10", label: "10", title: "Adjournment", page: 2 },
  ]},
];

const AUDIENCE_COPY = {
  public: {
    title: "Public Meeting Guide",
    summary: "The public view prioritizes what is being decided, how to follow the agenda, where affected properties are, and what to verify after the meeting.",
    cards: [
      ["Before", "Find zoning items, affected PIDs, current/proposed zones, and source package pages."],
      ["During", "Track the item number, motion wording, amendments, vote, and any questions taken under advisement."],
      ["After", "Compare against official minutes and check whether maps, bylaws, and parcel context changed."]
    ],
  },
  council: {
    title: "Council Decision Brief",
    summary: "The council view prioritizes procedural stage, decision wording, conflicts, source evidence, and questions requiring staff follow-up.",
    cards: [
      ["Before", "Review reading stage, legal/property identifiers, current/proposed zones, and Official Plan implications."],
      ["During", "Confirm conflicts, motion wording, amendments, debate issues, staff answers, and vote result."],
      ["After", "Confirm adopted wording, implementation instructions, and unresolved questions."]
    ],
  },
  staff: {
    title: "Staff Meeting Control",
    summary: "The staff view prioritizes source completeness, procedural capture, implementation tasks, minutes, and data update obligations.",
    cards: [
      ["Before", "Verify package completeness, PIDs, maps, bylaw references, and agenda item stage."],
      ["During", "Capture amendments, deferrals, procedural instructions, vote outcomes, and follow-up ownership."],
      ["After", "Publish/update minutes, update bylaw status, map layers, structured data, and implementation records."]
    ],
  },
};

function Header() {
  return (
    <header className="app-header">
      <img src="../../assets/logo-island-needle.svg" alt="Modern Democracy" className="wm" />
      <nav>
        <a href="/parcel-lookup">Parcel lookup</a>
        <a href="/zoning-comparison">Compare bylaws</a>
        <a className="active" href="/council-meetings">Council meetings</a>
        <a href="/restriction-stack">View Spatial Restrictions</a>
        <a href="/city-view">Map</a>
      </nav>
    </header>
  );
}

function allItems() {
  return AGENDA_TREE.flatMap((group) => group.items);
}

function findRecord(payload, id) {
  return [
    ...(payload?.agendaSections || []),
    ...(payload?.committeeReports || []),
    ...(payload?.resolutions || []),
    ...(payload?.bylawReadings || []),
    ...(payload?.planningItems || []),
  ].find((item) => item.agenda_section_id === id || item.item_id === id || item.planning_item_id === id || item.committee_report_id === id);
}

function citationPage(record, fallbackItem) {
  const packageCitation = (record?.citations || []).find((citation) => citation.source_document_id === "package");
  if (packageCitation) return { documentId: "package", page: packageCitation.pdf_page_start };
  return { documentId: fallbackItem?.packagePage ? "package" : "agenda", page: fallbackItem?.packagePage || fallbackItem?.page || 1 };
}

function primaryPid(item) {
  return item?.property_references?.[0]?.pids?.[0] || "";
}

function queryForRezoning(item) {
  const pid = primaryPid(item);
  const amendment = item?.zoning_amendment || {};
  const params = new URLSearchParams({
    pid,
    title: item?.title || "Rezoning application",
    fromZone: amendment.from_zone || "",
    toZone: amendment.to_zone || "",
    meeting: "charlottetown-2026-05-12-regular-council",
    item: item?.item_id || "",
  });
  return params.toString();
}

function AgendaTree({ selectedId, onSelect }) {
  return (
    <aside className="agenda-panel">
      <div className="tabs" aria-label="Audience tabs">
        {["public", "council", "staff"].map((audience) => (
          <button type="button" key={audience} className={window.__activeAudience === audience ? "active" : ""} onClick={() => window.__setAudience(audience)}>
            {audience[0].toUpperCase() + audience.slice(1)}
          </button>
        ))}
      </div>
      <h2 className="section-title">Agenda Tree</h2>
      <div className="tree">
        {AGENDA_TREE.map((group) => (
          <details className="tree-group" open={group.open} key={group.group}>
            <summary>{group.group}</summary>
            <div className="tree-items">
              {group.items.map((item) => (
                <button type="button" className={`tree-button ${selectedId === item.id ? "active" : ""}`} onClick={() => onSelect(item.id)} key={item.id}>
                  <span className="label">{item.label}</span>
                  <span className="title">{item.title}</span>
                </button>
              ))}
            </div>
          </details>
        ))}
      </div>
    </aside>
  );
}

function GeneralInfo({ audience, payload }) {
  const copy = AUDIENCE_COPY[audience];
  return (
    <>
      <div className="main-header">
        <div className="section-title">{payload.meeting.date} at {payload.meeting.time}</div>
        <h1>{copy.title}</h1>
        <p>{copy.summary}</p>
      </div>
      <div className="content-scroll">
        <div className="info-grid">
          {copy.cards.map(([title, body]) => (
            <article className="info-card" key={title}>
              <h2>{title}</h2>
              <p>{body}</p>
            </article>
          ))}
        </div>
        <div className="package-card" style={{marginTop: 14}}>
          <h2>Meeting Information</h2>
          <div className="meta-grid">
            <div className="k">Body</div><div className="v">{payload.meeting.body}</div>
            <div className="k">Location</div><div className="v">{payload.meeting.location}</div>
            <div className="k">Stream</div><div className="v"><a href={payload.meeting.livestream_url}>{payload.meeting.livestream_url}</a></div>
            <div className="k">Sources</div><div className="v">{payload.sourceDocuments.length} PDFs</div>
          </div>
        </div>
      </div>
    </>
  );
}

function SelectedItemView({ audience, payload, selectedId }) {
  const treeItem = allItems().find((item) => item.id === selectedId);
  const record = findRecord(payload, selectedId);
  const [sourcePage, setSourcePage] = useState(null);
  const [sourceChoice, setSourceChoice] = useState(() => citationPage(record, treeItem));

  useEffect(() => {
    if (!treeItem) return;
    const next = citationPage(record, treeItem);
    setSourceChoice(next);
  }, [selectedId]);

  useEffect(() => {
    if (!sourceChoice?.documentId || !sourceChoice?.page) return;
    fetch(`/api/council-meetings/current/source-page?documentId=${encodeURIComponent(sourceChoice.documentId)}&page=${encodeURIComponent(sourceChoice.page)}`)
      .then((response) => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
      .then(setSourcePage)
      .catch((error) => setSourcePage({ text: `Unable to load source page: ${error.message}` }));
  }, [sourceChoice.documentId, sourceChoice.page]);

  if (!treeItem) return null;
  const isRezoning = Boolean(record?.zoning_amendment);
  const pageOptions = (record?.citations || []).map((citation) => ({
    documentId: citation.source_document_id,
    page: citation.pdf_page_start,
    label: `${citation.source_document_id} page ${citation.pdf_page_start}`,
  }));
  if (!pageOptions.length) pageOptions.push({ ...sourceChoice, label: `${sourceChoice.documentId} page ${sourceChoice.page}` });

  return (
    <>
      <div className="main-header">
        <div className="section-title">Agenda item {treeItem.label}</div>
        <h1>{record?.title || record?.title_raw || treeItem.title}</h1>
        <p>{record?.public_summary || record?.summary || record?.decision_requested || "Agenda source text is shown below."}</p>
        <div className="badge-row">
          {record?.stage && <span className="badge urgent">{record.stage.replaceAll("_", " ")}</span>}
          {record?.zoning_amendment && <span className="badge">{record.zoning_amendment.from_zone} to {record.zoning_amendment.to_zone}</span>}
          {record?.property_references?.flatMap((ref) => ref.pids || []).map((pid) => <span className="badge" key={pid}>PID {pid}</span>)}
        </div>
      </div>
      <div className="content-scroll">
        <select className="source-select" value={`${sourceChoice.documentId}:${sourceChoice.page}`} onChange={(event) => {
          const [documentId, page] = event.target.value.split(":");
          setSourceChoice({ documentId, page: Number(page) });
        }}>
          {pageOptions.map((option) => <option value={`${option.documentId}:${option.page}`} key={`${option.documentId}-${option.page}`}>{option.label}</option>)}
        </select>
        <article className="package-card">
          <h2>{sourceChoice.documentId} package text, page {sourceChoice.page}</h2>
          <pre className="package-text">{sourcePage?.text || "Loading source page."}</pre>
        </article>
      </div>
    </>
  );
}

function ContextPanel({ audience, payload, selectedId }) {
  const treeItem = allItems().find((item) => item.id === selectedId);
  const record = findRecord(payload, selectedId);
  const workflow = payload.audienceWorkflows.find((candidate) => {
    if (audience === "public") return candidate.audience === "public_member";
    if (audience === "council") return candidate.audience === "council_or_committee";
    return candidate.audience === "municipal_staff";
  });
  const isRezoning = Boolean(record?.zoning_amendment);
  const rezoningQuery = isRezoning ? queryForRezoning(record) : "";
  const pid = primaryPid(record);
  return (
    <aside className="context-panel">
      <section className="context-card">
        <h2>{audience === "public" ? "Public needs" : audience === "council" ? "Council needs" : "Staff needs"}</h2>
        <ul className="workflow-list">
          {(workflow?.stages || []).flatMap((stage) => stage.tasks).map((task) => <li key={task}>{task}</li>)}
        </ul>
      </section>
      <section className="context-card">
        <h2>Agenda Context</h2>
        {selectedId ? (
          <div className="meta-grid">
            <div className="k">Item</div><div className="v">{treeItem?.label} {treeItem?.title}</div>
            <div className="k">Stage</div><div className="v">{record?.stage || "not extracted"}</div>
            <div className="k">Decision</div><div className="v">{record?.decision_requested || "not extracted"}</div>
          </div>
        ) : <p className="empty-note">Select an agenda item for item-specific context.</p>}
      </section>
      {isRezoning && (
        <section className="context-card">
          <h2>Rezoning Tools</h2>
          <div className="route-actions">
            <a className="btn btn-primary" href={`/rezoning-parcel-lookup?${rezoningQuery}`}>Parcel Lookup</a>
            <a className="btn btn-primary" href={`/rezoning-zoning-comparison?${rezoningQuery}`}>Compare bylaws</a>
            <a className="btn btn-primary" href={`/rezoning-restriction-stack?pid=${encodeURIComponent(pid)}&${rezoningQuery}`}>View Spatial Restrictions</a>
            <a className="btn btn-primary" href={`/rezoning-storm-surge?pid=${encodeURIComponent(pid)}&${rezoningQuery}`}>Storm Surge</a>
          </div>
        </section>
      )}
      <section className="context-card">
        <h2>Interface Controls</h2>
        <ul className="check-list">
          <li>Use the left tree to follow agenda order.</li>
          <li>Use the package selector to switch source pages.</li>
          <li>Use copied rezoning endpoints for meeting-specific experiments.</li>
        </ul>
      </section>
    </aside>
  );
}

function App() {
  const [payload, setPayload] = useState(null);
  const [status, setStatus] = useState("loading");
  const [audience, setAudience] = useState("public");
  const [selectedId, setSelectedId] = useState("");
  window.__activeAudience = audience;
  window.__setAudience = setAudience;

  useEffect(() => {
    fetch("/api/council-meetings/current")
      .then((response) => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
      .then((data) => { setPayload(data); setStatus("ready"); })
      .catch((error) => setStatus(error.message));
  }, []);

  if (status !== "ready") {
    return <><Header /><main className="content-scroll">{status === "loading" ? "Loading meeting data." : status}</main></>;
  }

  return (
    <div className="meeting-app">
      <Header />
      <div className="meeting-workspace">
        <AgendaTree selectedId={selectedId} onSelect={setSelectedId} />
        <main className="main-panel">
          {selectedId
            ? <SelectedItemView audience={audience} payload={payload} selectedId={selectedId} />
            : <GeneralInfo audience={audience} payload={payload} />}
        </main>
        <ContextPanel audience={audience} payload={payload} selectedId={selectedId} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
